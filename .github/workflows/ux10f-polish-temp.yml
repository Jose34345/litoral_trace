name: UX10-F Polish Temp

on:
  pull_request:

permissions:
  contents: write

jobs:
  polish:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ux10-f-litoral-trace-release-control'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply final UX polish
        run: |
          python - <<'PY'
          from pathlib import Path

          base = Path('src/litoral_trace/templates/app/base_app.html')
          text = base.read_text(encoding='utf-8')
          old = '''                                {% elif item.key == "traceability" %}\n                                <i class="fa-solid fa-route"></i>\n                                {% elif item.key == "vault" %}'''
          new = '''                                {% elif item.key == "traceability" %}\n                                <i class="fa-solid fa-route"></i>\n                                {% elif item.key == "release_control" %}\n                                <i class="fa-solid fa-gauge-high"></i>\n                                {% elif item.key == "vault" %}'''
          if old not in text:
              raise SystemExit('base_app release-control icon anchor not found')
          base.write_text(text.replace(old, new, 1), encoding='utf-8')

          template = Path('src/litoral_trace/templates/traceability_release_control.html')
          text = template.read_text(encoding='utf-8')
          old_pdf = '{% if control.links.dossier_pdf %}<a href="{{ control.links.dossier_pdf }}"'
          new_pdf = '{% if control.manifest_sha256 and control.links.dossier_pdf %}<a href="{{ control.links.dossier_pdf }}"'
          old_zip = '{% if control.links.dossier_bundle %}<a href="{{ control.links.dossier_bundle }}"'
          new_zip = '{% if control.manifest_sha256 and control.links.dossier_bundle %}<a href="{{ control.links.dossier_bundle }}"'
          if old_pdf not in text or old_zip not in text:
              raise SystemExit('release-control dossier action anchors not found')
          text = text.replace(old_pdf, new_pdf, 1).replace(old_zip, new_zip, 1)
          template.write_text(text, encoding='utf-8')
          PY

      - name: Commit polish and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/litoral_trace/templates/app/base_app.html src/litoral_trace/templates/traceability_release_control.html
          git rm .github/workflows/ux10f-polish-temp.yml
          git commit -m "Polish UX10-F release actions"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
