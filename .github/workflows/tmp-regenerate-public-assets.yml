name: Temporary Regenerate Public Assets

on:
  push:
    branches:
      - v1-public-enterprise-polish
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1-public-enterprise-polish
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit generated assets if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Generated assets already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/litoral_trace/static/dist/app.css src/litoral_trace/static/vendor
          git commit -m 'chore(frontend): regenerate tracked assets'
          git push origin HEAD:v1-public-enterprise-polish
