name: Ops Neon Read-Only Operation Inspect

on:
  push:
    branches:
      - ops/neon-inspect-b7c3a5e3-20260925

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MIGRATION_DATABASE_URL: ${{ secrets.US_LACEY_NEON_MIGRATION_DATABASE_URL }}
      TARGET_OPERATION: b7c3a5e3-b2fc-4b8f-883c-258a78e9f64e
    steps:
      - name: Install query dependencies
        run: python -m pip install --quiet "sqlalchemy>=2,<3" "psycopg[binary]>=3,<4"

      - name: Inspect target operation and jobs (read-only)
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MIGRATION_DATABASE_URL:-}"
          python - <<'PY'
          import json, os
          from sqlalchemy import create_engine, text
          from sqlalchemy.engine import make_url

          url = make_url(os.environ["MIGRATION_DATABASE_URL"])
          if url.drivername in {"postgresql", "postgres", "postgresql+psycopg2"}:
              url = url.set(drivername="postgresql+psycopg")
          engine = create_engine(url, pool_pre_ping=True, hide_parameters=True)
          target = os.environ["TARGET_OPERATION"]

          def clean(row):
              return {k: (str(v) if v is not None else None) for k, v in dict(row).items()}

          with engine.connect() as conn:
              tx = conn.begin()
              op = conn.execute(text("""
                  SELECT id, public_id, organization_id, status, created_at, updated_at
                  FROM public.us_lacey_operations
                  WHERE public_id = CAST(:target AS uuid)
              """), {"target": target}).mappings().one_or_none()
              print("OPERATION=" + json.dumps(clean(op) if op else None, sort_keys=True))
              if op:
                  jobs = conn.execute(text("""
                      SELECT
                          j.id, j.public_id, j.assurance_document_id,
                          j.status, j.attempt_count, j.max_attempts,
                          j.available_at, j.locked_by, j.locked_at, j.heartbeat_at,
                          j.current_stage, j.stage_started_at,
                          j.last_error_code, j.last_error_message,
                          j.created_at, j.updated_at,
                          d.processing_status AS document_processing_status,
                          d.last_error_code AS document_error_code,
                          d.last_error_message AS document_error_message
                      FROM public.us_lacey_processing_jobs AS j
                      LEFT JOIN public.assurance_documents AS d
                        ON d.id = j.assurance_document_id
                      WHERE j.organization_id = :org_id
                        AND j.operation_id = :operation_id
                      ORDER BY j.id
                  """), {
                      "org_id": int(op["organization_id"]),
                      "operation_id": int(op["id"]),
                  }).mappings().all()
                  print("JOBS=" + json.dumps([clean(r) for r in jobs], sort_keys=True))
              tx.rollback()
          engine.dispose()
          PY
