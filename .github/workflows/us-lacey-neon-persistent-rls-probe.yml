name: US Lacey Neon Persistent RLS Probe

on:
  push:
    branches:
      - wip/us-lacey-live-readiness
    paths:
      - .github/workflows/us-lacey-neon-persistent-rls-probe.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: us-lacey-neon-persistent-rls-probe
  cancel-in-progress: false

jobs:
  persistent-rls-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUNTIME_DATABASE_URL: ${{ secrets.US_LACEY_NEON_RUNTIME_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install probe dependencies
        run: python -m pip install "sqlalchemy>=2" "psycopg[binary]>=3"

      - name: Require dedicated runtime connection secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${RUNTIME_DATABASE_URL:-}" ]; then
            echo "Missing GitHub secret US_LACEY_NEON_RUNTIME_DATABASE_URL"
            exit 1
          fi
          echo "Dedicated runtime connection secret is configured (value not printed)."

      - name: Prove persistent tenant A/B isolation with rollback
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import secrets

          from sqlalchemy import create_engine, text
          from sqlalchemy.engine import make_url
          from sqlalchemy.exc import DBAPIError

          url = make_url(os.environ["RUNTIME_DATABASE_URL"])
          if url.drivername in {"postgresql", "postgres", "postgresql+psycopg2"}:
              url = url.set(drivername="postgresql+psycopg")

          engine = create_engine(url, pool_pre_ping=True, hide_parameters=True)
          suffix = secrets.token_hex(5)
          # Use explicit high random IDs so the probe never consumes production sequences.
          org_a = secrets.randbelow(400_000_000) + 1_200_000_000
          org_b = secrets.randbelow(400_000_000) + 1_600_000_000
          op_a = secrets.randbelow(400_000_000) + 1_200_000_000
          op_b = secrets.randbelow(400_000_000) + 1_600_000_000

          with engine.connect() as conn:
              tx = conn.begin()
              try:
                  role = conn.execute(text("select current_user")).scalar_one()
                  attrs = conn.execute(text("""
                      select rolsuper, rolbypassrls
                      from pg_roles where rolname = current_user
                  """)).one()
                  if role != "litoral_trace_app":
                      raise SystemExit(f"Expected litoral_trace_app runtime role; found {role}")
                  if attrs.rolsuper or attrs.rolbypassrls:
                      raise SystemExit("Runtime role unexpectedly bypasses RLS")

                  def tenant(org_id: int) -> None:
                      conn.execute(
                          text("select set_config('app.current_organization_id', :org, true)"),
                          {"org": str(org_id)},
                      )

                  for label, org_id in (("A", org_a), ("B", org_b)):
                      tenant(org_id)
                      conn.execute(text("""
                          insert into organizations (
                              id, name, slug, tax_id, tier, description, is_active
                          ) values (
                              :id, :name, :slug, :tax_id, 'pro',
                              'Transactional persistent RLS probe', true
                          )
                      """), {
                          "id": org_id,
                          "name": f"LT Persistent RLS {label} {suffix}",
                          "slug": f"lt-persistent-rls-{label.lower()}-{suffix}",
                          "tax_id": f"RLS-{label}-{suffix}",
                      })

                  for label, org_id, operation_id in (
                      ("A", org_a, op_a),
                      ("B", org_b, op_b),
                  ):
                      tenant(org_id)
                      conn.execute(text("""
                          insert into us_lacey_operations (
                              id, organization_id, client_reference, status,
                              document_count, merchandise_line_count
                          ) values (
                              :id, :org, :reference, 'NEW', 0, 1
                          )
                      """), {
                          "id": operation_id,
                          "org": org_id,
                          "reference": f"PERSISTENT-RLS-{label}-{suffix}",
                      })

                  tenant(org_a)
                  visible = conn.execute(text("""
                      select id, organization_id
                      from us_lacey_operations
                      where id in (:a, :b)
                      order by id
                  """), {"a": op_a, "b": op_b}).all()
                  if [(row.id, row.organization_id) for row in visible] != [(op_a, org_a)]:
                      raise SystemExit(f"Cross-tenant read isolation failed: {visible}")
                  print("persistent_rls_cross_tenant_read=PASS")

                  updated = conn.execute(text("""
                      update us_lacey_operations
                      set review_result = 'MUST_NOT_WRITE'
                      where id = :operation_b
                  """), {"operation_b": op_b})
                  if updated.rowcount != 0:
                      raise SystemExit("Cross-tenant update unexpectedly affected tenant B")
                  print("persistent_rls_cross_tenant_update=PASS")

                  conn.execute(text("savepoint cross_tenant_insert"))
                  insert_denied = False
                  try:
                      conn.execute(text("""
                          insert into us_lacey_operations (
                              id, organization_id, client_reference, status,
                              document_count, merchandise_line_count
                          ) values (
                              :id, :other_org, 'PERSISTENT-CROSS-TENANT-DENIED',
                              'NEW', 0, 1
                          )
                      """), {"id": op_b - 1, "other_org": org_b})
                  except DBAPIError:
                      insert_denied = True
                      conn.execute(text("rollback to savepoint cross_tenant_insert"))
                  finally:
                      conn.execute(text("release savepoint cross_tenant_insert"))
                  if not insert_denied:
                      raise SystemExit("Cross-tenant insert was not denied")
                  print("persistent_rls_cross_tenant_insert=PASS")

                  own_row = conn.execute(
                      text("select id from us_lacey_operations where id = :operation_a"),
                      {"operation_a": op_a},
                  ).scalar_one_or_none()
                  if own_row != op_a:
                      raise SystemExit("Tenant A cannot read its own operation")
                  print("persistent_rls_own_tenant_access=PASS")
                  print("persistent_rls_role=litoral_trace_app")
                  print("persistent_rls_probe=PASS")
              finally:
                  tx.rollback()

          engine.dispose()
          print("persistent_rls_cleanup=ROLLBACK")
          PY
