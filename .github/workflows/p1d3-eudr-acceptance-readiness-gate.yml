name: P1-D3 EUDR ACCEPTANCE Readiness Gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1d3-eudr-acceptance-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p1d3-eudr-acceptance-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENVIRONMENT: development
      JWT_SECRET_KEY: p1d3-ci-only-jwt-secret-key-2026
      EUDR_ACCEPTANCE_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Gate P1-D3 - sanitized readiness and deployment contract
        run: python -m pytest -q -rs tests/test_p1d3_acceptance_readiness_unittest.py

      - name: Validate production Compose with network disabled
        shell: bash
        env:
          DATABASE_URL: postgresql+psycopg://runtime:placeholder@db/app
          WORKER_DATABASE_URL: postgresql+psycopg://worker:placeholder@db/app
          JWT_SECRET_KEY: p1d3-compose-only-jwt-secret-key-2026
          STORAGE_BACKEND: s3
          STORAGE_BUCKET_NAME: p1d3-ci-placeholder
          OPS_ALERT_GITHUB_TOKEN: p1d3-ci-placeholder
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: p1d3-ci-placeholder
          POSTGRES_DB: litoral_trace
        run: docker compose -f docker-compose.prod.yml config >/tmp/p1d3-compose.yml

      - name: Assert CI cannot perform real ACCEPTANCE smoke
        shell: bash
        run: |
          test "${EUDR_ACCEPTANCE_ENABLED}" = "false"
          test -z "${EUDR_ACCEPTANCE_ENDPOINT_URL:-}"
          test -z "${EUDR_ACCEPTANCE_USERNAME:-}"
          test -z "${EUDR_ACCEPTANCE_AUTHENTICATION_KEY:-}"
          test -z "${EUDR_ACCEPTANCE_WEB_SERVICE_CLIENT_ID:-}"
