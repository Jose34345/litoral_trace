name: Apply Traceability Jinja Items Hotfix

on:
  push:
    branches:
      - hotfix-traceability-jinja-items
    paths:
      - ".github/workflows/apply-traceability-jinja-hotfix.yml"

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix-traceability-jinja-items
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Patch colliding Jinja dict attribute access
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('src/litoral_trace/templates/traceability.html'): (
                  '{% for item in result.items %}',
                  '{% for item in result["items"] %}',
              ),
              Path('src/litoral_trace/templates/app/_traceability_lineage_graph.html'): (
                  '{% for item in graph.items %}',
                  '{% for item in graph["items"] %}',
              ),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one collision, found {count}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          regression = Path('tests/test_traceability_jinja_render_regression.py')
          regression.write_text('''"""Regression: complete genealogy must render instead of resolving dict.items."""\nfrom types import SimpleNamespace\n\nfrom litoral_trace.web.templates import templates\nfrom litoral_trace.web.traceability import build_traceability_view\n\n\ndef test_complete_traceability_view_renders_items_key_without_dict_method_collision() -> None:\n    payload = {\n        "shipment": {\n            "shipment_code": "SMOKE-RENDER-001",\n            "status": "DISPATCHED",\n            "lineage_state": "FINAL",\n        },\n        "allocation_method": "PROPORTIONAL_INPUT_ALLOCATION",\n        "complete": True,\n        "issues": [],\n        "unit_totals": [],\n        "items": [],\n        "events": [],\n        "source_lotes": [],\n    }\n    view = build_traceability_view(query="SMOKE-RENDER-001", payload=payload)\n    context = {\n        "traceability_view": view,\n        "user": SimpleNamespace(\n            username="smoke",\n            organization_name="Smoke Org",\n            role="admin",\n        ),\n        "navigation": (),\n        "csrf_form_field": "csrf_token",\n        "csrf_token": "test-token",\n        "csrf_header_name": "X-CSRF-Token",\n        "url_for": lambda name, **kwargs: f"/static{kwargs.get('path', '')}",\n    }\n    rendered = templates.env.get_template("traceability.html").render(context)\n    assert "SMOKE-RENDER-001" in rendered\n    assert "Productos despachados" in rendered\n''', encoding='utf-8')
          PY
      - name: Install dependencies
        run: python -m pip install --quiet -r requirements.txt
      - name: Run targeted regression gates
        run: |
          python -m pytest -q \
            tests/test_traceability_jinja_render_regression.py \
            tests/test_traceability_p1d_ui_unittest.py \
            tests/test_ux10c_lineage_graph_unittest.py
      - name: Commit hotfix to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/litoral_trace/templates/traceability.html \
                  src/litoral_trace/templates/app/_traceability_lineage_graph.html \
                  tests/test_traceability_jinja_render_regression.py
          git commit -m "fix: render traceability items keys explicitly"
          git push origin HEAD:hotfix-traceability-jinja-items
