name: US Lacey PostgreSQL Gate

on:
  pull_request:
    paths:
      - "alembic/versions/034_add_us_lacey_pilot_core.py"
      - "alembic/versions/035_add_us_lacey_self_service.py"
      - "src/litoral_trace/us_lacey/**"
      - "src/litoral_trace/web/us_lacey_*"
      - "src/litoral_trace/db/models/us_lacey.py"
      - "src/litoral_trace/db/models/us_lacey_commercial.py"
      - "src/litoral_trace/db/models/__init__.py"
      - "src/litoral_trace/db/tenant.py"
      - "tests/test_us_lacey_*"
      - ".github/workflows/us-lacey-postgres-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: us-lacey-postgres-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: us_lacey_root_password_2026
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ENVIRONMENT: development
      ENABLE_POSTGRES_TESTS: "1"
      JWT_SECRET_KEY: us-lacey-ci-only-jwt-secret-key-2026
      LITORAL_TRACE_BOOTSTRAP_SUPERADMIN_PASSWORD: UsLaceyCiBootstrapPassword2026
      MIGRATION_DATABASE_URL: postgresql+psycopg://lt_us_lacey_migrator:us_lacey_migrator_password_2026@127.0.0.1:5432/litoral_trace_us_lacey_ci
      TEST_POSTGRES_MIGRATION_DATABASE_URL: postgresql+psycopg://lt_us_lacey_migrator:us_lacey_migrator_password_2026@127.0.0.1:5432/litoral_trace_us_lacey_ci
      DATABASE_URL: postgresql+psycopg://litoral_trace_app:us_lacey_runtime_password_2026@127.0.0.1:5432/litoral_trace_us_lacey_ci
      TEST_POSTGRES_DATABASE_URL: postgresql+psycopg://litoral_trace_app:us_lacey_runtime_password_2026@127.0.0.1:5432/litoral_trace_us_lacey_ci
      US_LACEY_ENVIRONMENT: test
      US_LACEY_DATABASE_URL: postgresql+psycopg://litoral_trace_app:us_lacey_runtime_password_2026@127.0.0.1:5432/litoral_trace_us_lacey_ci
      US_LACEY_STORAGE_BUCKET: us-lacey-ci-private
      US_LACEY_STORAGE_PREFIX: us-lacey/ci
      US_LACEY_APP_HOSTNAME: app.lacey.litoraltrace.com
      US_LACEY_SESSION_TTL_HOURS: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest alembic
      - name: Provision migration owner and runtime role
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from sqlalchemy import create_engine

          root = create_engine(
              "postgresql+psycopg://postgres:us_lacey_root_password_2026@127.0.0.1:5432/postgres",
              isolation_level="AUTOCOMMIT",
              pool_pre_ping=True,
              hide_parameters=True,
          )
          statements = [
              """
              CREATE ROLE lt_us_lacey_migrator
                LOGIN PASSWORD 'us_lacey_migrator_password_2026'
                NOSUPERUSER NOCREATEDB CREATEROLE INHERIT NOBYPASSRLS
              """,
              """
              CREATE ROLE litoral_trace_app
                LOGIN PASSWORD 'us_lacey_runtime_password_2026'
                NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS
              """,
              "CREATE DATABASE litoral_trace_us_lacey_ci OWNER lt_us_lacey_migrator",
          ]
          with root.connect() as connection:
              for statement in statements:
                  connection.exec_driver_sql(statement)
          root.dispose()

          target = create_engine(
              "postgresql+psycopg://postgres:us_lacey_root_password_2026@127.0.0.1:5432/litoral_trace_us_lacey_ci",
              isolation_level="AUTOCOMMIT",
              pool_pre_ping=True,
              hide_parameters=True,
          )
          with target.connect() as connection:
              connection.exec_driver_sql("CREATE EXTENSION IF NOT EXISTS postgis")
              connection.exec_driver_sql("GRANT CONNECT ON DATABASE litoral_trace_us_lacey_ci TO litoral_trace_app")
              connection.exec_driver_sql("GRANT USAGE ON SCHEMA public TO litoral_trace_app")
          target.dispose()
          PY
      - name: Migrate through pre-Assurance baseline
        run: python -m alembic upgrade 029_add_smart_import_profiles
      - name: Migrate through US Lacey self-service head
        run: python -m alembic upgrade head
      - name: Verify canonical head and tenant hardening
        shell: bash
        run: |
          set -euo pipefail
          python -m alembic current | tee /tmp/alembic-current.txt
          grep -F "035_us_lacey_self_service" /tmp/alembic-current.txt
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text

          expected_policy_counts = {
              "us_lacey_organization_profiles": 5,
              "us_lacey_operations": 4,
              "us_lacey_operation_documents": 4,
              "us_lacey_operation_fields": 4,
              "us_lacey_subscriptions": 5,
              "us_lacey_payments": 5,
              "us_lacey_terms_acceptances": 5,
              "us_lacey_processing_jobs": 6,
          }
          engine = create_engine(os.environ["MIGRATION_DATABASE_URL"], pool_pre_ping=True)
          with engine.connect() as connection:
              rows = connection.execute(text("""
                  SELECT c.relname, c.relrowsecurity, c.relforcerowsecurity
                  FROM pg_class c
                  JOIN pg_namespace n ON n.oid = c.relnamespace
                  WHERE n.nspname = 'public' AND c.relname = ANY(:names)
              """), {"names": sorted(expected_policy_counts)}).mappings().all()
              policies = connection.execute(text("""
                  SELECT tablename, count(*) AS policy_count
                  FROM pg_policies
                  WHERE schemaname = 'public' AND tablename = ANY(:names)
                  GROUP BY tablename
              """), {"names": sorted(expected_policy_counts)}).mappings().all()
              verification_table = connection.execute(text("""
                  SELECT to_regclass('public.us_lacey_email_verifications') IS NOT NULL
              """)).scalar_one()
              runtime_verification_privilege = connection.execute(text("""
                  SELECT has_table_privilege('litoral_trace_app', 'public.us_lacey_email_verifications', 'SELECT')
              """)).scalar_one()
          by_table = {row["relname"]: row for row in rows}
          assert set(by_table) == set(expected_policy_counts)
          assert all(row["relrowsecurity"] is True for row in by_table.values())
          assert all(row["relforcerowsecurity"] is True for row in by_table.values())
          counts = {row["tablename"]: row["policy_count"] for row in policies}
          assert counts == expected_policy_counts
          assert verification_table is True
          assert runtime_verification_privilege is False
          engine.dispose()
          PY
      - name: Prove self-registration and email transition
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ["DATABASE_URL"], pool_pre_ping=True)
          verification_hash = "a" * 64
          fake_bcrypt_hash = "$2b$12$" + ("x" * 53)
          with engine.begin() as connection:
              registered = connection.execute(text("""
                  SELECT * FROM public.us_lacey_self_register(
                      :legal_name, :business_type, :admin_name, :email,
                      :password_hash, :verification_hash, :price_cents,
                      :monthly_limit, :provider, :terms_version,
                      :privacy_version, :beta_version
                  )
              """), {
                  "legal_name": "US Lacey Gate Imports LLC",
                  "business_type": "IMPORTER",
                  "admin_name": "Gate Admin",
                  "email": "gate-admin@example.com",
                  "password_hash": fake_bcrypt_hash,
                  "verification_hash": verification_hash,
                  "price_cents": 10000,
                  "monthly_limit": 25,
                  "provider": "WISE",
                  "terms_version": "gate-terms-v1",
                  "privacy_version": "gate-privacy-v1",
                  "beta_version": "gate-beta-v1",
              }).mappings().one()
              assert registered["account_status"] == "PENDING_EMAIL"
              assert registered["payment_reference"].startswith("LT-US-")
              verified = connection.execute(text("""
                  SELECT * FROM public.us_lacey_verify_email(:token_hash)
              """), {"token_hash": verification_hash}).mappings().one()
              assert verified["organization_id"] == registered["organization_id"]
              assert verified["account_status"] == "PAYMENT_PENDING"
          engine.dispose()
          PY
      - name: Prove portal login, opaque session and logout
        env:
          DATABASE_URL: ""
        run: >-
          python -m pytest -q -rs
          tests/test_us_lacey_portal_postgres_integration.py
      - name: Prove tenant A/B isolation
        run: python -m pytest -q -rs tests/test_us_lacey_rls_postgres_integration.py
