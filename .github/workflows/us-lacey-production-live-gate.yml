name: US Lacey Production Live Gate

on:
  push:
    branches:
      - feature/us-lacey-pilot-platform
    paths:
      - .github/workflows/us-lacey-production-live-gate.yml
      - requirements.txt
      - alembic/versions/*us_lacey*.py
      - src/litoral_trace/db/models/us_lacey*.py
      - src/litoral_trace/db/models/reconciliation_issue.py
      - src/litoral_trace/templates/us_lacey/**
      - src/litoral_trace/templates/public/lacey.html
      - src/litoral_trace/us_lacey/**
      - src/litoral_trace/web/us_lacey_*.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-live-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ORIGIN: https://lacey.litoraltrace.com
    steps:
      - name: Wake service and verify health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            code="$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 20 "$ORIGIN/health" || true)"
            if [ "$code" = "200" ]; then
              break
            fi
            echo "health attempt $attempt returned HTTP ${code:-network-error}; waiting for production rollout"
            sleep 5
          done
          test "${code:-}" = "200"
          python - <<'PY'
          import json
          from pathlib import Path
          body = json.loads(Path('/tmp/health.json').read_text())
          assert body.get('status') == 'healthy', body
          assert body.get('service') == 'us-lacey-pilot', body
          print('production_health=PASS')
          PY

      - name: Wait for unified Early Access landing deployment
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 72); do
            code="$(curl -sS -D /tmp/root.headers -o /tmp/root.html -w '%{http_code}' --max-time 20 "$ORIGIN/" || true)"
            if [ "$code" = "200" ] \
              && grep -Fq 'U.S. Lacey Act document preparation' /tmp/root.html \
              && grep -Fq 'Stop manually preparing Lacey spreadsheets.' /tmp/root.html \
              && grep -Fq 'Early Access · U.S. Lacey Act' /tmp/root.html \
              && grep -Fq 'Founding Early Access — USD 149/month' /tmp/root.html \
              && grep -Fq 'Up to 100 Lacey operations/month. Early-access pricing locked for 12 months.' /tmp/root.html \
              && grep -Fq 'href="/signup"' /tmp/root.html \
              && grep -Fq 'href="/login"' /tmp/root.html \
              && grep -Fq 'href="/sandbox/start"' /tmp/root.html; then
              break
            fi
            echo "Early Access landing attempt $attempt not deployed yet (HTTP ${code:-network-error}); waiting"
            sleep 5
          done

          test "${code:-}" = "200"
          grep -Fq 'U.S. Lacey Act document preparation' /tmp/root.html
          grep -Fq 'Stop manually preparing Lacey spreadsheets.' /tmp/root.html
          grep -Fq 'Early Access · U.S. Lacey Act' /tmp/root.html
          grep -Fq 'Founding Early Access — USD 149/month' /tmp/root.html \
              && grep -Fq 'Up to 100 Lacey operations/month. Early-access pricing locked for 12 months.' /tmp/root.html
          grep -Fq 'Founding Early Access — USD 149/month' /tmp/root.html \
              && grep -Fq 'Up to 100 Lacey operations/month. Early-access pricing locked for 12 months.' /tmp/root.html
          grep -Fq 'Human review required' /tmp/root.html
          grep -Fq 'href="/signup"' /tmp/root.html
          grep -Fq 'href="/login"' /tmp/root.html
          grep -Fq 'href="/sandbox/start"' /tmp/root.html
          if grep -Fq 'Phase VII' /tmp/root.html; then
            echo 'Forbidden internal phase label found on public landing: Phase VII'
            exit 1
          fi

          grep -Eiq '^cache-control: .*no-store' /tmp/root.headers
          grep -Eiq '^x-content-type-options: *nosniff' /tmp/root.headers
          grep -Eiq '^x-frame-options: *DENY' /tmp/root.headers
          grep -Eiq '^referrer-policy: *same-origin' /tmp/root.headers

          banned=(
            'Trazabilidad de origen'
            'Debida diligencia'
            'Contexto regional'
            'Auditabilidad'
            'Acceso de clientes'
            'Solicitar demostración'
            'Argentina · Cadenas forestales · Comercio exterior'
          )
          for phrase in "${banned[@]}"; do
            if grep -Fq "$phrase" /tmp/root.html; then
              echo "Forbidden regional/Spanish landing copy found: $phrase"
              exit 1
            fi
          done
          echo 'production_early_access_landing=PASS'

      - name: Verify canonical and legacy marketing routes
        shell: bash
        run: |
          set -euo pipefail

          for path in /demo /lacey/demo; do
            code="$(curl -sS -o /tmp/demo.html -w '%{http_code}' --max-time 20 "$ORIGIN$path")"
            test "$code" = "200"
            grep -Fq 'Illustrative sample' /tmp/demo.html
            grep -Fq 'href="/signup"' /tmp/demo.html
            echo "marketing_route_${path//\//_}=PASS"
          done

          code="$(curl -sS -o /tmp/legacy.html -w '%{http_code}' --max-time 20 "$ORIGIN/lacey")"
          test "$code" = "200"
          grep -Fq 'Create account' /tmp/legacy.html
          echo 'marketing_route_legacy_landing=PASS'

          for path in /event /lacey/event; do
            code="$(curl -sS -o /tmp/event.out -w '%{http_code}' --max-time 20 -X POST -H 'Content-Type: application/x-www-form-urlencoded' --data 'event=lacey_visit' "$ORIGIN$path")"
            test "$code" = "204"
            echo "marketing_route_${path//\//_}=PASS"
          done

      - name: Verify deployed English-only U.S. portal shell
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            code="$(curl -sS -o /tmp/login.html -w '%{http_code}' --max-time 20 "$ORIGIN/login" || true)"
            if [ "$code" = "200" ] \
              && grep -Fq 'U.S. Lacey Act workspace' /tmp/login.html \
              && grep -Fq 'Litoral Trace · U.S. Lacey Early Access' /tmp/login.html \
              && grep -Fq 'lang="en"' /tmp/login.html; then
              break
            fi
            echo "Early Access English-shell attempt $attempt not deployed yet (HTTP ${code:-network-error}); waiting"
            sleep 5
          done
          test "${code:-}" = "200"
          grep -Fq 'U.S. Lacey Act workspace' /tmp/login.html
          grep -Fq 'Litoral Trace · U.S. Lacey Early Access' /tmp/login.html
          grep -Fq 'lang="en"' /tmp/login.html
          grep -Fq 'Skip to main content' /tmp/login.html

          banned=(
            'Trazabilidad de origen'
            'Plataforma'
            'Debida diligencia'
            'Contexto regional'
            'Auditabilidad'
            'Acceso de clientes'
            'Solicitar demostración'
            'Solicitar demo'
            'Ir al contenido principal'
            'Navegación pública'
            'Argentina · Cadenas forestales · Comercio exterior'
          )

          for path in /login /signup /legal/terms /legal/privacy /legal/private-beta; do
            code="$(curl -sS -o /tmp/portal.html -w '%{http_code}' --max-time 20 "$ORIGIN$path")"
            test "$code" = "200"
            grep -Fq 'U.S. Lacey Act workspace' /tmp/portal.html
            grep -Fq 'lang="en"' /tmp/portal.html
            for phrase in "${banned[@]}"; do
              if grep -Fq "$phrase" /tmp/portal.html; then
                echo "Forbidden regional/Spanish portal copy found at $path: $phrase"
                exit 1
              fi
            done
            echo "english_shell_${path##*/}=PASS"
          done

      - name: Verify unauthenticated workspace guard
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -D /tmp/operations.headers -o /tmp/operations.body -w '%{http_code}' --max-time 20 "$ORIGIN/operations")"
          test "$code" = "303"
          grep -Eiq '^location: */login' /tmp/operations.headers
          echo 'production_operations_auth_guard=PASS'

      - name: Verify production readiness and storage roundtrip
        shell: bash
        run: |
          set -euo pipefail

          # Web readiness is topology-aware. The previously deployed revision may
          # still return HTTP 503 because it predates the dedicated-worker readiness
          # contract, so accept 200/503 only when storage + OCR are healthy and the
          # inline worker is explicitly absent/not-ready.
          for attempt in $(seq 1 48); do
            code="$(curl -sS -o /tmp/live.json -w '%{http_code}' --max-time 20 "$ORIGIN/live-readiness" || true)"
            if [ "$code" = "200" ] || [ "$code" = "503" ]; then
              if python - <<'PY'
          import json
          from pathlib import Path
          body = json.loads(Path('/tmp/live.json').read_text())
          assert body.get('storage_roundtrip') == 'ready', body
          assert body.get('ocr_runtime') == 'ready', body
          assert body.get('inline_worker') in ('disabled', 'not_ready'), body
          PY
              then
                break
              fi
            fi
            echo "live-readiness attempt $attempt returned HTTP ${code:-network-error}; waiting for web runtime readiness"
            sleep 5
          done
          test "${code:-}" = "200" -o "${code:-}" = "503"

          python - <<'PY'
          import json
          from pathlib import Path
          body = json.loads(Path('/tmp/live.json').read_text())
          assert body.get('storage_roundtrip') == 'ready', body
          assert body.get('ocr_runtime') == 'ready', body
          assert body.get('inline_worker') in ('disabled', 'not_ready'), body
          shadow = body.get('multilingual_shadow')
          assert shadow in (None, 'disabled'), body
          print('production_web_storage_roundtrip=PASS')
          print('production_web_ocr_runtime=PASS')
          print('production_inline_worker=DISABLED_AS_EXPECTED')
          PY

          # The dedicated U.S. Lacey worker is internal to Northflank and has no
          # public ingress by design. Its liveness belongs to Northflank's internal
          # healthcheck/monitoring plane, not to a public GitHub Actions probe.
          echo 'production_worker_topology=DEDICATED_INTERNAL'

      - name: Verify readiness contract
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 48); do
            code="$(curl -sS -o /tmp/ready.json -w '%{http_code}' --max-time 20 "$ORIGIN/ready" || true)"
            if [ "$code" = "200" ]; then
              if python - <<'PY'
          import json
          from pathlib import Path
          body = json.loads(Path('/tmp/ready.json').read_text())
          assert body.get('status') == 'ready', body
          assert body.get('service') == 'us-lacey-pilot', body
          assert body.get('environment') in ('pilot', 'production'), body
          assert body.get('hostname') == 'lacey.litoraltrace.com', body
          PY
              then
                break
              fi
            fi
            echo "ready attempt $attempt returned HTTP ${code:-network-error}; waiting for production rollout"
            sleep 5
          done

          test "${code:-}" = "200"
          python - <<'PY'
          import json
          from pathlib import Path
          body = json.loads(Path('/tmp/ready.json').read_text())
          assert body.get('status') == 'ready', body
          assert body.get('service') == 'us-lacey-pilot', body
          assert body.get('environment') in ('pilot', 'production'), body
          assert body.get('hostname') == 'lacey.litoraltrace.com', body
          print('production_ready=PASS')
          PY

      - name: Verify legal pages
        shell: bash
        run: |
          set -euo pipefail
          for path in /legal/terms /legal/privacy /legal/private-beta; do
            code="$(curl -sS -o /tmp/legal.html -w '%{http_code}' --max-time 20 "$ORIGIN$path")"
            test "$code" = "200"
            grep -qi '<html' /tmp/legal.html
            echo "legal_page_${path##*/}=PASS"
          done
