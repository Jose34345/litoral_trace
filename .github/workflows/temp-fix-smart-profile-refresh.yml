name: Temporary Smart Import RLS Refresh Fix

on:
  push:
    branches:
      - feature/smart-import-v1
    paths:
      - ".github/workflows/temp-fix-smart-profile-refresh.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: temp-smart-import-rls-refresh-fix
  cancel-in-progress: true

jobs:
  patch-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature head
        uses: actions/checkout@v4
        with:
          ref: feature/smart-import-v1
          fetch-depth: 0

      - name: Apply fail-closed tenant refresh fix and regression test
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          profile_path = Path("src/litoral_trace/services/smart_import/profiles.py")
          text = profile_path.read_text(encoding="utf-8")
          old = """            session.commit()\n            session.refresh(profile)\n            return profile\n"""
          new = """            # Flush the audit row before detaching the profile so every DB write\n            # still belongs to the same transaction. Detaching before commit avoids a\n            # post-commit refresh: PostgreSQL transaction-local tenant context is cleared\n            # by commit and FORCE RLS must never be bypassed merely to materialize the\n            # return value. A failure in this flush or commit still rolls back atomically.\n            session.flush()\n            session.expunge(profile)\n            session.commit()\n            return profile\n"""
          if text.count(old) != 1:
              raise SystemExit("Expected exactly one post-commit Smart Import refresh block.")
          profile_path.write_text(text.replace(old, new), encoding="utf-8")

          test_path = Path("tests/test_smart_import_profile_audit.py")
          tests = test_path.read_text(encoding="utf-8")
          marker = "def test_profile_return_is_detached_before_commit_without_post_commit_refresh()"
          if marker not in tests:
              tests += """


def test_profile_return_is_detached_before_commit_without_post_commit_refresh() -> None:
    candidate, mappings = _candidate_and_mappings()
    session = _new_profile_session()
    service = SmartImportProfileService(session_factory=lambda: session)
    lifecycle: list[str] = []

    session.expunge.side_effect = lambda profile: lifecycle.append("expunge")
    session.commit.side_effect = lambda: lifecycle.append("commit")

    with (
        patch(
            "litoral_trace.services.smart_import.profiles.set_tenant_db_context",
            return_value=None,
        ),
        patch(
            "litoral_trace.services.smart_import.profiles.record_audit_event",
            return_value=MagicMock(),
        ),
    ):
        profile = service.remember(
            organization_id=123,
            user_id=456,
            candidate=candidate,
            mappings=mappings,
            name="Recepciones planta",
        )

    assert profile.id == 77
    assert lifecycle == ["expunge", "commit"]
    assert session.flush.call_count >= 2
    assert session.refresh.called is False
"""
              test_path.write_text(tests, encoding="utf-8")
          PY

      - name: Remove temporary workflow from candidate tree
        run: git rm .github/workflows/temp-fix-smart-profile-refresh.yml

      - name: Commit reviewed fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/litoral_trace/services/smart_import/profiles.py tests/test_smart_import_profile_audit.py
          git diff --cached --check
          git commit -m "fix: keep Smart Import profile return tenant-safe"
          git push origin HEAD:feature/smart-import-v1

      - name: Dispatch exact-head closure gates
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run ci.yml --repo "$GH_REPO" --ref feature/smart-import-v1
          gh workflow run release-integration-gates.yml --repo "$GH_REPO" --ref feature/smart-import-v1
