name: UX10B CSS Sync Temp

on:
  push:
    branches:
      - ux10-b-operational-dashboard

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ux10-b-operational-dashboard
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Build tracked frontend assets
        run: |
          npm ci
          npm run build
      - name: Commit generated bundle
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Tracked frontend assets already reproducible.'
            exit 0
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/litoral_trace/static/dist/app.css src/litoral_trace/static/vendor
          git commit -m 'build(ux10b): synchronize frontend assets'
          git push origin HEAD:ux10-b-operational-dashboard
