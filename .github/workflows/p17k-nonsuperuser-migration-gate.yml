name: P1.7-K Non-Superuser Migration Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p17k-nonsuperuser-migration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  non-superuser-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: p17k_root_password_2026
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      ENVIRONMENT: development
      ENABLE_POSTGRES_TESTS: "1"
      JWT_SECRET_KEY: p17k-ci-only-jwt-secret-key-2026
      LITORAL_TRACE_BOOTSTRAP_SUPERADMIN_PASSWORD: P17kCiBootstrapPassword2026
      MIGRATION_DATABASE_URL: postgresql+psycopg://lt_p17k_migrator:p17k_migrator_password_2026@127.0.0.1:5432/litoral_trace_p17k_ci
      TEST_POSTGRES_MIGRATION_DATABASE_URL: postgresql+psycopg://lt_p17k_migrator:p17k_migrator_password_2026@127.0.0.1:5432/litoral_trace_p17k_ci
      DATABASE_URL: postgresql+psycopg://litoral_trace_app:p17k_runtime_password_2026@127.0.0.1:5432/litoral_trace_p17k_ci
      TEST_POSTGRES_DATABASE_URL: postgresql+psycopg://litoral_trace_app:p17k_runtime_password_2026@127.0.0.1:5432/litoral_trace_p17k_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest alembic

      - name: Provision non-superuser migration owner and runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from sqlalchemy import create_engine

          root = create_engine(
              "postgresql+psycopg://postgres:p17k_root_password_2026@127.0.0.1:5432/postgres",
              isolation_level="AUTOCOMMIT",
              pool_pre_ping=True,
              hide_parameters=True,
          )
          statements = [
              """
              CREATE ROLE lt_p17k_migrator
                LOGIN
                PASSWORD 'p17k_migrator_password_2026'
                NOSUPERUSER
                NOCREATEDB
                CREATEROLE
                INHERIT
                NOBYPASSRLS
              """,
              """
              CREATE ROLE litoral_trace_app
                LOGIN
                PASSWORD 'p17k_runtime_password_2026'
                NOSUPERUSER
                NOCREATEDB
                NOCREATEROLE
                NOINHERIT
                NOBYPASSRLS
              """,
              "CREATE DATABASE litoral_trace_p17k_ci OWNER lt_p17k_migrator",
          ]
          with root.connect() as connection:
              for statement in statements:
                  connection.exec_driver_sql(statement)
          root.dispose()

          target_root = create_engine(
              "postgresql+psycopg://postgres:p17k_root_password_2026@127.0.0.1:5432/litoral_trace_p17k_ci",
              isolation_level="AUTOCOMMIT",
              pool_pre_ping=True,
              hide_parameters=True,
          )
          with target_root.connect() as connection:
              connection.exec_driver_sql("CREATE EXTENSION IF NOT EXISTS postgis")
              connection.exec_driver_sql(
                  "GRANT CONNECT ON DATABASE litoral_trace_p17k_ci TO litoral_trace_app"
              )
              connection.exec_driver_sql(
                  "GRANT USAGE ON SCHEMA public TO litoral_trace_app"
              )
          target_root.dispose()
          PY

      - name: Verify migration principal is production-shaped
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ["MIGRATION_DATABASE_URL"], pool_pre_ping=True)
          with engine.connect() as connection:
              row = connection.execute(text("""
                  SELECT
                      current_user AS role_name,
                      r.rolsuper,
                      r.rolcreatedb,
                      r.rolcreaterole,
                      r.rolbypassrls,
                      has_schema_privilege(current_user, 'public', 'CREATE') AS public_create
                  FROM pg_roles AS r
                  WHERE r.rolname = current_user
              """)).mappings().one()

          assert row["role_name"] == "lt_p17k_migrator"
          assert row["rolsuper"] is False
          assert row["rolcreatedb"] is False
          assert row["rolcreaterole"] is True
          assert row["rolbypassrls"] is False
          assert row["public_create"] is True
          engine.dispose()
          PY

      - name: Migrate baseline through 027
        run: python -m alembic upgrade 027_fix_platform_rls_bootstrap

      - name: Seed colliding pre-existing platform role
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from sqlalchemy import create_engine

          engine = create_engine(
              "postgresql+psycopg://lt_p17k_migrator:p17k_migrator_password_2026@127.0.0.1:5432/postgres",
              isolation_level="AUTOCOMMIT",
              pool_pre_ping=True,
              hide_parameters=True,
          )
          with engine.connect() as connection:
              connection.exec_driver_sql(
                  """
                  CREATE ROLE litoral_trace_platform_definer
                    LOGIN
                    PASSWORD 'p17k_collision_only_password_2026'
                    NOSUPERUSER
                    NOCREATEDB
                    NOCREATEROLE
                    INHERIT
                    NOREPLICATION
                    NOBYPASSRLS
                  """
              )
          engine.dispose()
          PY

      - name: Expect migration 028 to reject the cluster role collision
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python -m alembic upgrade head > collision-attempt.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected migration 028 to reject a pre-existing cluster role." >&2
            exit 1
          fi
          grep -F "platform definer role already exists outside migration 028 lifecycle" collision-attempt.log

      - name: Verify collision attempt left role unchanged and database at 027
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from sqlalchemy import create_engine, text

          engine = create_engine(
              "postgresql+psycopg://lt_p17k_migrator:p17k_migrator_password_2026@127.0.0.1:5432/postgres",
              pool_pre_ping=True,
              hide_parameters=True,
          )
          with engine.connect() as connection:
              role = connection.execute(text("""
                  SELECT rolcanlogin, rolinherit, rolsuper, rolcreatedb,
                         rolcreaterole, rolreplication, rolbypassrls
                  FROM pg_catalog.pg_roles
                  WHERE rolname = 'litoral_trace_platform_definer'
              """)).mappings().one()
          assert role["rolcanlogin"] is True
          assert role["rolinherit"] is True
          assert role["rolsuper"] is False
          assert role["rolcreatedb"] is False
          assert role["rolcreaterole"] is False
          assert role["rolreplication"] is False
          assert role["rolbypassrls"] is False
          engine.dispose()
          PY
          python -m alembic current | tee collision-current.txt
          grep -F "027_fix_platform_rls_bootstrap" collision-current.txt

      - name: Remove collision and migrate to canonical head
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from sqlalchemy import create_engine

          engine = create_engine(
              "postgresql+psycopg://lt_p17k_migrator:p17k_migrator_password_2026@127.0.0.1:5432/postgres",
              isolation_level="AUTOCOMMIT",
              pool_pre_ping=True,
              hide_parameters=True,
          )
          with engine.connect() as connection:
              connection.exec_driver_sql("DROP ROLE litoral_trace_platform_definer")
          engine.dispose()
          PY
          python -m alembic upgrade head

      - name: Gate platform definer privilege model
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -rs \
            tests/test_platform_definer_p17k_postgres_integration.py \
            --junitxml=p17k-nonsuperuser-platform.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("p17k-nonsuperuser-platform.xml").getroot()
          attrs = root.attrib
          skipped = int(attrs.get("skipped", 0))
          failures = int(attrs.get("failures", 0))
          errors = int(attrs.get("errors", 0))
          if skipped or failures or errors:
              raise SystemExit(
                  "P1.7-K non-superuser migration gate fails closed: "
                  f"skipped={skipped}, failures={failures}, errors={errors}"
              )
          PY

      - name: Verify 028 downgrade removes only its own role
        shell: bash
        run: |
          set -euo pipefail
          python -m alembic downgrade 027_fix_platform_rls_bootstrap
          python - <<'PY'
          from sqlalchemy import create_engine, text

          engine = create_engine(
              "postgresql+psycopg://lt_p17k_migrator:p17k_migrator_password_2026@127.0.0.1:5432/postgres",
              pool_pre_ping=True,
              hide_parameters=True,
          )
          with engine.connect() as connection:
              count = connection.execute(text("""
                  SELECT count(*)
                  FROM pg_catalog.pg_roles
                  WHERE rolname = 'litoral_trace_platform_definer'
              """)).scalar_one()
          assert count == 0
          engine.dispose()
          PY
          python -m alembic current | tee rollback-current.txt
          grep -F "027_fix_platform_rls_bootstrap" rollback-current.txt

      - name: Re-upgrade to canonical head after rollback proof
        run: python -m alembic upgrade head

      - name: Re-gate final platform definer state
        run: >-
          python -m pytest -q -rs
          tests/test_platform_definer_p17k_postgres_integration.py

      - name: Verify canonical head
        shell: bash
        run: |
          set -euo pipefail
          python -m alembic current | tee alembic-current.txt
          grep -F "028_platform_definer_rls" alembic-current.txt
