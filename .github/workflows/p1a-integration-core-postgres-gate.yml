name: P1-A Integration Core PostgreSQL Gate

on:
  pull_request:
    branches:
      - p2-enterprise-production
  push:
    branches:
      - p2-enterprise-production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1a-integration-core-postgres-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p1a-integration-core-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: p1a_owner_password_2026
          POSTGRES_DB: litoral_trace_p1a_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d litoral_trace_p1a_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      ENVIRONMENT: development
      ENABLE_POSTGRES_TESTS: "1"
      JWT_SECRET_KEY: p1a-ci-only-jwt-secret-key-2026
      LITORAL_TRACE_BOOTSTRAP_SUPERADMIN_PASSWORD: P1aCiBootstrapPassword2026
      TEST_POSTGRES_MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:p1a_owner_password_2026@127.0.0.1:5432/litoral_trace_p1a_ci
      MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:p1a_owner_password_2026@127.0.0.1:5432/litoral_trace_p1a_ci
      TEST_POSTGRES_DATABASE_URL: postgresql+psycopg://litoral_trace_app:p1a_runtime_password_2026@127.0.0.1:5432/litoral_trace_p1a_ci
      DATABASE_URL: postgresql+psycopg://litoral_trace_app:p1a_runtime_password_2026@127.0.0.1:5432/litoral_trace_p1a_ci
      TEST_POSTGRES_WORKER_DATABASE_URL: postgresql+psycopg://litoral_trace_worker_p1a:p1a_worker_password_2026@127.0.0.1:5432/litoral_trace_p1a_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest alembic

      - name: Provision least-privilege principals
        shell: bash
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine

          engine = create_engine(
              os.environ["TEST_POSTGRES_MIGRATION_DATABASE_URL"],
              isolation_level="AUTOCOMMIT",
              pool_pre_ping=True,
              hide_parameters=True,
          )
          statements = [
              """
              CREATE ROLE litoral_trace_app
                LOGIN
                PASSWORD 'p1a_runtime_password_2026'
                NOSUPERUSER
                NOCREATEDB
                NOCREATEROLE
                NOINHERIT
                NOBYPASSRLS
              """,
              """
              CREATE ROLE litoral_trace_worker_p1a
                LOGIN
                PASSWORD 'p1a_worker_password_2026'
                NOSUPERUSER
                NOCREATEDB
                NOCREATEROLE
                INHERIT
                NOBYPASSRLS
              """,
              "GRANT CONNECT ON DATABASE litoral_trace_p1a_ci TO litoral_trace_app",
              "GRANT CONNECT ON DATABASE litoral_trace_p1a_ci TO litoral_trace_worker_p1a",
              "GRANT USAGE ON SCHEMA public TO litoral_trace_app",
              "GRANT USAGE ON SCHEMA public TO litoral_trace_worker_p1a",
          ]
          with engine.connect() as connection:
              for statement in statements:
                  connection.exec_driver_sql(statement)
          engine.dispose()
          PY

      - name: Migrate database to P1-A canonical head
        run: python -m alembic upgrade head

      - name: Provision existing-domain read contract and worker capability
        shell: bash
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine

          engine = create_engine(
              os.environ["TEST_POSTGRES_MIGRATION_DATABASE_URL"],
              isolation_level="AUTOCOMMIT",
              pool_pre_ping=True,
              hide_parameters=True,
          )
          with engine.connect() as connection:
              connection.exec_driver_sql(
                  "GRANT SELECT ON TABLE public.lotes TO litoral_trace_app"
              )
              connection.exec_driver_sql(
                  "GRANT litoral_trace_worker_executor TO litoral_trace_worker_p1a"
              )
          engine.dispose()
          PY

      - name: Verify canonical revision
        shell: bash
        run: |
          set -euo pipefail
          python -m alembic current | tee p1a-alembic-current.txt
          grep -F "022_add_integration_history" p1a-alembic-current.txt

      - name: Write isolated runtime contract
        shell: bash
        run: |
          cat > .env.integration <<'EOF'
          ENABLE_POSTGRES_TESTS=1
          TEST_POSTGRES_DATABASE_URL=postgresql+psycopg://litoral_trace_app:p1a_runtime_password_2026@127.0.0.1:5432/litoral_trace_p1a_ci
          TEST_POSTGRES_MIGRATION_DATABASE_URL=postgresql+psycopg://postgres:p1a_owner_password_2026@127.0.0.1:5432/litoral_trace_p1a_ci
          TEST_POSTGRES_WORKER_DATABASE_URL=postgresql+psycopg://litoral_trace_worker_p1a:p1a_worker_password_2026@127.0.0.1:5432/litoral_trace_p1a_ci
          EOF

      - name: Gate P1-A - runtime, RLS, idempotency and immutable history
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -rs \
            tests/test_integration_core_p1a_postgres_integration.py \
            --junitxml=p1a-integration-core-postgres.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("p1a-integration-core-postgres.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
          tests = sum(int(s.attrib.get("tests", "0")) for s in suites)
          skipped = sum(int(s.attrib.get("skipped", "0")) for s in suites)
          failures = sum(int(s.attrib.get("failures", "0")) for s in suites)
          errors = sum(int(s.attrib.get("errors", "0")) for s in suites)
          if tests != 1 or skipped or failures or errors:
              raise SystemExit(
                  "P1-A PostgreSQL gate fails closed: "
                  f"tests={tests}, skipped={skipped}, failures={failures}, errors={errors}"
              )
          PY

      - name: Cleanup isolated contract
        if: always()
        run: rm -f .env.integration
