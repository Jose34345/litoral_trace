name: UX10D Runtime Route Fix Temp

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch-runtime-registration:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Patch runtime registration and acceptance contract
        run: |
          python - <<'PY'
          from pathlib import Path

          main_path = Path("main.py")
          main_text = main_path.read_text(encoding="utf-8")
          old_import = '''from litoral_trace.web.router import (\n    router as web_router,\n)\n\nfrom litoral_trace.web.runtime import (\n'''
          new_import = '''from litoral_trace.web.router import (\n    router as web_router,\n)\nfrom litoral_trace.web.traceability_operations import (\n    router as traceability_operations_router,\n)\n\nfrom litoral_trace.web.runtime import (\n'''
          if old_import not in main_text:
              raise SystemExit("main import anchor not found")
          main_text = main_text.replace(old_import, new_import, 1)

          old_registration = '''app.include_router(\n    web_router\n)\n\n\n# ---------------------------------------------------------------------------\n# Legacy direct-call compatibility\n'''
          new_registration = '''app.include_router(\n    web_router\n)\n\n# UX10-D is a write workspace owned by the web layer. ``web_router`` can be\n# imported while the operational submodule is still initializing, and\n# APIRouter.include_router() copies routes eagerly. Register the completed\n# operational router here only when that earlier copy did not materialize.\nif not any(\n    getattr(route, "path", "") == "/operations"\n    for route in app.routes\n):\n    app.include_router(\n        traceability_operations_router\n    )\n\n\n# ---------------------------------------------------------------------------\n# Legacy direct-call compatibility\n'''
          if old_registration not in main_text:
              raise SystemExit("main registration anchor not found")
          main_path.write_text(main_text.replace(old_registration, new_registration, 1), encoding="utf-8")

          test_path = Path("tests/test_ux10d_traceability_operations_unittest.py")
          test_text = test_path.read_text(encoding="utf-8")
          old_block = '''def test_ux10d_routes_and_template_keep_browser_as_presentation_layer():\n    from litoral_trace.web.traceability_operations import router as runtime_operations_router\n    from litoral_trace.web.router import router as runtime_web_router\n\n    declared_routes = {\n        (route.path, tuple(sorted(route.methods or set())))\n        for route in runtime_operations_router.routes\n        if getattr(route, "path", "").startswith("/operations")\n    }\n    app = FastAPI()\n    app.include_router(runtime_web_router)\n    routes = {\n        (route.path, tuple(sorted(route.methods or set())))\n        for route in app.routes\n        if getattr(route, "path", "").startswith("/operations")\n    }\n'''
          new_block = '''def test_ux10d_routes_and_template_keep_browser_as_presentation_layer():\n    import main as main_module\n    from litoral_trace.web.traceability_operations import router as runtime_operations_router\n\n    declared_routes = {\n        (route.path, tuple(sorted(route.methods or set())))\n        for route in runtime_operations_router.routes\n        if getattr(route, "path", "").startswith("/operations")\n    }\n    routes = {\n        (route.path, tuple(sorted(route.methods or set())))\n        for route in main_module.app.routes\n        if getattr(route, "path", "").startswith("/operations")\n    }\n'''
          if old_block not in test_text:
              raise SystemExit("test route block anchor not found")
          test_path.write_text(test_text.replace(old_block, new_block, 1), encoding="utf-8")
          PY

      - name: Commit runtime fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/ux10d-runtime-route-fix-temp.yml
          git add -- main.py tests/test_ux10d_traceability_operations_unittest.py .github/workflows/ux10d-runtime-route-fix-temp.yml
          git commit -m "fix(ux10d): register operational routes in runtime app"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
