name: Temporary Smart Import P1.7-K Dispatcher

on:
  push:
    branches:
      - feature/smart-import-v1
    paths:
      - ".github/workflows/temp-smart-import-p17k-dispatch.yml"

permissions:
  actions: write
  contents: read

concurrency:
  group: temp-smart-import-p17k-dispatch
  cancel-in-progress: true

jobs:
  dispatch-p17k:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch existing P1.7-K gate on Smart Import branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_REF: feature/smart-import-v1
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run p17k-nonsuperuser-migration-gate.yml \
            --repo "$GH_REPO" \
            --ref "$TARGET_REF"
