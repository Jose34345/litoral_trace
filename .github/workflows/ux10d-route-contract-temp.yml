name: UX10D Route Contract Temp

on:
  pull_request:
    branches:
      - ux10-c-lineage-graph

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'ux10-d-chain-of-custody-operations' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout UX10-D head
        uses: actions/checkout@v4
        with:
          ref: ux10-d-chain-of-custody-operations
          fetch-depth: 0

      - name: Validate runtime web composition instead of collection-time alias
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_ux10d_traceability_operations_unittest.py')
          text = path.read_text(encoding='utf-8')
          old = '''def test_ux10d_routes_and_template_keep_browser_as_presentation_layer():\n    app = FastAPI()\n    app.include_router(operations_router)\n    routes = {\n        (route.path, tuple(sorted(route.methods or set())))\n        for route in app.routes\n        if getattr(route, "path", "").startswith("/operations")\n    }\n'''
          new = '''def test_ux10d_routes_and_template_keep_browser_as_presentation_layer():\n    from litoral_trace.web.traceability_operations import router as runtime_operations_router\n    from litoral_trace.web.router import router as runtime_web_router\n\n    declared_routes = {\n        (route.path, tuple(sorted(route.methods or set())))\n        for route in runtime_operations_router.routes\n        if getattr(route, "path", "").startswith("/operations")\n    }\n    app = FastAPI()\n    app.include_router(runtime_web_router)\n    routes = {\n        (route.path, tuple(sorted(route.methods or set())))\n        for route in app.routes\n        if getattr(route, "path", "").startswith("/operations")\n    }\n    assert declared_routes == routes\n'''
          if old not in text:
              raise SystemExit('UX10-D route contract anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/ux10d-route-contract-temp.yml

      - name: Commit route contract correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_ux10d_traceability_operations_unittest.py .github/workflows/ux10d-route-contract-temp.yml
          git commit -m 'test(ux10d): validate runtime web route composition'
          git push origin HEAD:ux10-d-chain-of-custody-operations
