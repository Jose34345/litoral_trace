name: UX10D Route Resolution Fix Temp

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch-route-acceptance:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Patch route tests and permanent gate
        run: |
          python - <<'PY'
          from pathlib import Path

          test_path = Path("tests/test_ux10d_traceability_operations_unittest.py")
          test_text = test_path.read_text(encoding="utf-8")
          start = test_text.index("def test_ux10d_routes_and_template_keep_browser_as_presentation_layer():")
          template_anchor = "\n    root = Path(__file__).resolve().parents[1]\n    template = ("
          end = test_text.index(template_anchor, start)
          replacement = '''def test_ux10d_routes_and_template_keep_browser_as_presentation_layer():
    import json
    import os
    import subprocess
    import sys

    from litoral_trace.web.traceability_operations import router as runtime_operations_router

    expected_routes = {
        ("/operations", ("GET",)),
        ("/operations/receipts", ("POST",)),
        ("/operations/processes", ("POST",)),
        ("/operations/events/{event_public_id}/post", ("POST",)),
        ("/operations/shipments", ("POST",)),
        ("/operations/shipments/{shipment_public_id}/dispatch", ("POST",)),
    }
    declared_routes = {
        (route.path, tuple(sorted(route.methods or set())))
        for route in runtime_operations_router.routes
        if getattr(route, "path", "").startswith("/operations")
    }
    assert declared_routes == expected_routes

    root = Path(__file__).resolve().parents[1]
    env = dict(os.environ)
    env["PYTHONPATH"] = str(root / "src")
    probe_script = """
import json
import main

resolved = {
    "render_traceability_operations": str(
        main.app.url_path_for("render_traceability_operations")
    ),
    "create_receipt_operation": str(
        main.app.url_path_for("create_receipt_operation")
    ),
    "create_process_operation": str(
        main.app.url_path_for("create_process_operation")
    ),
    "post_existing_event_operation": str(
        main.app.url_path_for(
            "post_existing_event_operation",
            event_public_id="00000000-0000-0000-0000-000000000001",
        )
    ),
    "create_shipment_operation": str(
        main.app.url_path_for("create_shipment_operation")
    ),
    "dispatch_existing_shipment_operation": str(
        main.app.url_path_for(
            "dispatch_existing_shipment_operation",
            shipment_public_id="00000000-0000-0000-0000-000000000002",
        )
    ),
}
print("__UX10_RESOLVED__" + json.dumps(resolved, sort_keys=True))
"""
    probe = subprocess.run(
        [sys.executable, "-c", probe_script],
        cwd=root,
        env=env,
        check=True,
        capture_output=True,
        text=True,
    )
    payload_line = next(
        line
        for line in probe.stdout.splitlines()
        if line.startswith("__UX10_RESOLVED__")
    )
    resolved = json.loads(payload_line.removeprefix("__UX10_RESOLVED__"))
    assert resolved == {
        "render_traceability_operations": "/operations",
        "create_receipt_operation": "/operations/receipts",
        "create_process_operation": "/operations/processes",
        "post_existing_event_operation": (
            "/operations/events/00000000-0000-0000-0000-000000000001/post"
        ),
        "create_shipment_operation": "/operations/shipments",
        "dispatch_existing_shipment_operation": (
            "/operations/shipments/00000000-0000-0000-0000-000000000002/dispatch"
        ),
    }
'''
          test_path.write_text(
              test_text[:start] + replacement + test_text[end:],
              encoding="utf-8",
          )

          gate_path = Path(".github/workflows/ux10d-chain-of-custody-operations-gate.yml")
          gate_text = gate_path.read_text(encoding="utf-8")
          step_start = gate_text.index("      # This is intentionally a clean application import")
          step_end = gate_text.index("\n      - name: UX10-D operational acceptance", step_start)
          gate_replacement = '''      # FastAPI 0.141 can keep included routers behind internal routing nodes,
      # so production acceptance verifies public URL resolution plus the
      # operational router's declared method/path contract instead of relying
      # on the private shape of ``app.routes``.
      - name: UX10-D cold-start route resolution
        run: |
          python - <<'PY'
          import main
          from litoral_trace.web.traceability_operations import router as operations_router

          expected_declared = {
              ("/operations", ("GET",)),
              ("/operations/receipts", ("POST",)),
              ("/operations/processes", ("POST",)),
              ("/operations/events/{event_public_id}/post", ("POST",)),
              ("/operations/shipments", ("POST",)),
              ("/operations/shipments/{shipment_public_id}/dispatch", ("POST",)),
          }
          declared = {
              (route.path, tuple(sorted(route.methods or set())))
              for route in operations_router.routes
              if getattr(route, "path", "").startswith("/operations")
          }
          if declared != expected_declared:
              raise SystemExit(
                  f"UX10-D declared route mismatch: expected={sorted(expected_declared)!r} actual={sorted(declared)!r}"
              )

          resolved = {
              str(main.app.url_path_for("render_traceability_operations")),
              str(main.app.url_path_for("create_receipt_operation")),
              str(main.app.url_path_for("create_process_operation")),
              str(
                  main.app.url_path_for(
                      "post_existing_event_operation",
                      event_public_id="00000000-0000-0000-0000-000000000001",
                  )
              ),
              str(main.app.url_path_for("create_shipment_operation")),
              str(
                  main.app.url_path_for(
                      "dispatch_existing_shipment_operation",
                      shipment_public_id="00000000-0000-0000-0000-000000000002",
                  )
              ),
          }
          expected_resolved = {
              "/operations",
              "/operations/receipts",
              "/operations/processes",
              "/operations/events/00000000-0000-0000-0000-000000000001/post",
              "/operations/shipments",
              "/operations/shipments/00000000-0000-0000-0000-000000000002/dispatch",
          }
          if resolved != expected_resolved:
              raise SystemExit(
                  f"UX10-D cold-start URL resolution mismatch: expected={sorted(expected_resolved)!r} actual={sorted(resolved)!r}"
              )
          PY
'''
          gate_path.write_text(
              gate_text[:step_start] + gate_replacement + gate_text[step_end:],
              encoding="utf-8",
          )
          PY

      - name: Commit route acceptance fix and remove temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/ux10d-import-order-temp.yml
          rm -f .github/workflows/ux10d-route-resolution-fix-temp.yml
          git add -- tests/test_ux10d_traceability_operations_unittest.py .github/workflows/ux10d-chain-of-custody-operations-gate.yml .github/workflows/ux10d-import-order-temp.yml .github/workflows/ux10d-route-resolution-fix-temp.yml
          git commit -m "test(ux10d): validate nested FastAPI route resolution"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
