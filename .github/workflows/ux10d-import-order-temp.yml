name: UX10D Import Order Temp

on:
  pull_request:

permissions:
  contents: read

jobs:
  trace-import-order:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      ENABLE_POSTGRES_TESTS: "0"
      TEST_DATABASE_URL: sqlite:///litoral_trace_test.db
      JWT_SECRET_KEY: ci-only-jwt-secret-key-1234567890
      LITORAL_TRACE_BOOTSTRAP_SUPERADMIN_PASSWORD: CiBootstrap-Password-1234567890!
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Trace FastAPI instance and route retention
        run: |
          python - <<'PY'
          import builtins
          import traceback
          from fastapi import FastAPI

          original_import = builtins.__import__
          original_include = FastAPI.include_router
          original_init = FastAPI.__init__

          created = []

          def traced_init(self, *args, **kwargs):
              result = original_init(self, *args, **kwargs)
              created.append(id(self))
              print("=== FASTAPI INIT self=", id(self), "routes=", len(self.routes))
              traceback.print_stack(limit=8)
              return result

          def traced_import(name, globals=None, locals=None, fromlist=(), level=0):
              if "traceability_operations" in name:
                  print("=== IMPORT", name, "fromlist=", fromlist, "level=", level)
                  traceback.print_stack(limit=10)
              return original_import(name, globals, locals, fromlist, level)

          def traced_include(self, router, *args, **kwargs):
              before = len(self.routes)
              ops = [
                  (getattr(r, "path", None), sorted(getattr(r, "methods", set()) or set()))
                  for r in getattr(router, "routes", [])
                  if str(getattr(r, "path", "")).startswith("/operations")
              ]
              result = original_include(self, router, *args, **kwargs)
              after_ops = [
                  (getattr(r, "path", None), sorted(getattr(r, "methods", set()) or set()))
                  for r in self.routes
                  if str(getattr(r, "path", "")).startswith("/operations")
              ]
              if ops or getattr(router, "tags", None) == ["Frontend B2B"]:
                  print(
                      "=== FASTAPI INCLUDE self=", id(self),
                      "router=", id(router),
                      "child_ops=", ops,
                      "before=", before,
                      "after=", len(self.routes),
                      "app_ops_after=", after_ops,
                  )
                  traceback.print_stack(limit=8)
              return result

          builtins.__import__ = traced_import
          FastAPI.__init__ = traced_init
          FastAPI.include_router = traced_include

          import main
          import litoral_trace.web.traceability_operations as ops

          print("=== CREATED APPS", created)
          print("=== FINAL MAIN APP ID", id(main.app), "routes=", len(main.app.routes))
          print("=== FINAL OPS ROUTER", id(ops.router), [(r.path, sorted(r.methods or set())) for r in ops.router.routes])
          print("=== FINAL APP OPS", [(r.path, sorted(r.methods or set())) for r in main.app.routes if getattr(r, "path", "").startswith("/operations")])
          print("=== FINAL APP SAMPLE", [(r.path, sorted(r.methods or set())) for r in main.app.routes[:30]])
          PY
