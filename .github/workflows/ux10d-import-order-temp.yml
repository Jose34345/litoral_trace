name: UX10D Import Order Temp

on:
  pull_request:

permissions:
  contents: read

jobs:
  trace-import-order:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      ENABLE_POSTGRES_TESTS: "0"
      TEST_DATABASE_URL: sqlite:///litoral_trace_test.db
      JWT_SECRET_KEY: ci-only-jwt-secret-key-1234567890
      LITORAL_TRACE_BOOTSTRAP_SUPERADMIN_PASSWORD: CiBootstrap-Password-1234567890!
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Inspect nested routes and URL resolution
        run: |
          python - <<'PY'
          import main

          def walk(routes, depth=0):
              found = []
              for route in routes:
                  path = getattr(route, "path", "")
                  methods = tuple(sorted(getattr(route, "methods", set()) or set()))
                  name = getattr(route, "name", None)
                  route_type = type(route).__name__
                  if "operations" in path or (name and "operation" in str(name)):
                      found.append((depth, route_type, path, methods, name))
                  children = getattr(route, "routes", None)
                  if children:
                      found.extend(walk(children, depth + 1))
                  nested_app = getattr(route, "app", None)
                  nested_routes = getattr(nested_app, "routes", None)
                  if nested_routes and nested_routes is not children:
                      found.extend(walk(nested_routes, depth + 1))
              return found

          print("TOP_LEVEL_COUNT", len(main.app.routes))
          print("NESTED_OPERATION_ROUTES", walk(main.app.routes))

          names = [
              "render_traceability_operations",
              "create_receipt_operation",
              "create_process_operation",
              "post_existing_event_operation",
              "create_shipment_operation",
              "dispatch_existing_shipment_operation",
          ]
          for name in names:
              try:
                  print("URL_PATH_FOR", name, str(main.app.url_path_for(name)))
              except Exception as exc:
                  print("URL_PATH_FOR_ERROR", name, type(exc).__name__, str(exc))
          PY
