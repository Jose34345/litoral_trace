name: P1-A Accepted Review Fixes

on:
  push:
    branches:
      - p1a-integration-core-erp
    paths:
      - "scripts/p1a_review_fixes.py"
      - ".github/workflows/p1a-review-fixes.yml"

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p1a-integration-core-erp
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply accepted review fixes
        run: python scripts/p1a_review_fixes.py

      - name: Install Python dependencies
        run: python -m pip install --quiet -r requirements.txt pytest

      - name: Run focused regressions
        env:
          PYTHONPATH: src
          ENVIRONMENT: test
          TEST_DATABASE_URL: sqlite:///litoral_trace_test.db
          JWT_SECRET_KEY: ci-only-jwt-secret-key-1234567890
        run: |
          python -m pytest -q \
            tests/test_p1a_integration_core_unittest.py \
            tests/test_p1a_integration_models_unittest.py \
            tests/test_ux10d_traceability_operations_unittest.py
          python -c "import main; print('P1A_REVIEW_MAIN_IMPORT_OK', len(main.app.routes))"

      - name: Commit tested fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/litoral_trace/services/integrations/core.py \
            src/litoral_trace/web/integrations.py \
            tests/test_p1a_integration_core_unittest.py
          git commit -m "fix(p1a): address integration safety review"
          git push origin HEAD:p1a-integration-core-erp
