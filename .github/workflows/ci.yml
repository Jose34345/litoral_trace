name: CI

on:
  pull_request:
  push:
    branches:
      - p2-enterprise-production
      - p2-v1-closure
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ux10b-contract-sync-temp:
    if: github.event_name == 'pull_request' && github.head_ref == 'ux10-b-operational-dashboard' && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout UX10-B head
        uses: actions/checkout@v4
        with:
          ref: ux10-b-operational-dashboard
          fetch-depth: 0

      - name: Align composed dashboard contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_batch_p24g_ui_unittest.py')
          text = path.read_text(encoding='utf-8')
          old = '''def test_dashboard_template_no_longer_exposes_retired_batch_upload_ui():
              dashboard = DASHBOARD_TEMPLATE_PATH.read_text(encoding="utf-8")

              assert "/api/v1/batch/upload" not in dashboard
              assert 'accept=".xlsx,.xls"' not in dashboard
              assert "Stress Test & Carga Masiva Batch" not in dashboard
              assert "Procesamiento Masivo de Guias Forestales y Remitos" not in dashboard
              assert "batchResult" not in dashboard
              assert "btn-tab-batch" not in dashboard
              assert 'id="tab-batch"' not in dashboard
              assert "Plantilla Excel" in dashboard
              assert "Mapa geoespacial de rodales" in dashboard
              assert "Evaluación individual del rodal" in dashboard
          '''
          old = '\n'.join(line[14:] if line.startswith('              ') else line for line in old.splitlines()) + '\n'
          new = '''def test_dashboard_template_no_longer_exposes_retired_batch_upload_ui():
              dashboard = DASHBOARD_TEMPLATE_PATH.read_text(encoding="utf-8")
              cockpit = (
                  DASHBOARD_TEMPLATE_PATH.parent
                  / "app"
                  / "_dashboard_traceability_cockpit.html"
              ).read_text(encoding="utf-8")
              composed_dashboard = dashboard + "\\n" + cockpit

              assert "/api/v1/batch/upload" not in composed_dashboard
              assert 'accept=".xlsx,.xls"' not in composed_dashboard
              assert "Stress Test & Carga Masiva Batch" not in composed_dashboard
              assert "Procesamiento Masivo de Guias Forestales y Remitos" not in composed_dashboard
              assert "batchResult" not in composed_dashboard
              assert "btn-tab-batch" not in composed_dashboard
              assert 'id="tab-batch"' not in composed_dashboard
              assert "Plantilla Excel" in composed_dashboard
              assert "Mapa geoespacial de rodales" in composed_dashboard
              assert "Evaluación individual del rodal" in composed_dashboard
          '''
          new = '\n'.join(line[14:] if line.startswith('              ') else line for line in new.splitlines()) + '\n'
          if old not in text:
              raise SystemExit('Expected dashboard contract block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Remove temporary UX10-B sync files
        run: |
          rm -f .github/workflows/ux10b-final-test-sync-temp.yml
          rm -f .github/ux10b-trigger.tmp

      - name: Commit synchronized contract
        shell: bash
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tests/test_batch_p24g_ui_unittest.py
          git add -u -- .github/workflows/ux10b-final-test-sync-temp.yml .github/ux10b-trigger.tmp
          git commit -m 'test(ux10b): validate composed dashboard surface'
          git push origin HEAD:ux10-b-operational-dashboard

  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENVIRONMENT: test
      ENABLE_POSTGRES_TESTS: "0"
      TEST_DATABASE_URL: sqlite:///litoral_trace_test.db
      JWT_SECRET_KEY: ci-only-jwt-secret-key-1234567890
      LITORAL_TRACE_BOOTSTRAP_SUPERADMIN_PASSWORD: CiBootstrap-Password-1234567890!
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest alembic

      - name: Python syntax gate
        run: python -m compileall main.py src tests

      - name: Alembic canonical head gate
        shell: bash
        run: |
          alembic heads | tee alembic-heads.txt
          if [ "$(wc -l < alembic-heads.txt)" -ne 1 ]; then
            echo "Expected exactly one Alembic head."
            exit 1
          fi
          grep -Fx "019_add_traceability_genealogy (head)" alembic-heads.txt

      - name: Run pytest suite
        run: python -m pytest -q -rs

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Verify tracked assets are reproducible
        run: git diff --exit-code

  production-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build -f Dockerfile -t litoral-trace-ci .

      - name: Validate production Compose syntax
        env:
          DATABASE_URL: postgresql+psycopg://runtime_user:ci-placeholder@db/appdb
          WORKER_DATABASE_URL: postgresql+psycopg://worker_user:ci-placeholder@db/appdb
          JWT_SECRET_KEY: ci-placeholder-jwt-secret-key
          STORAGE_BACKEND: s3
          STORAGE_BUCKET_NAME: ci-private-bucket
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-placeholder-postgres-password
          POSTGRES_DB: appdb
          OPS_ALERT_GITHUB_TOKEN: ci-placeholder-ops-token
        run: docker compose -f docker-compose.prod.yml config --quiet

      - name: Validate production Nginx configuration
        shell: bash
        run: |
          set -euo pipefail
          CERT_DIR="$RUNNER_TEMP/litoral-trace-nginx-certs"
          mkdir -p "$CERT_DIR"
          openssl req \
            -x509 \
            -nodes \
            -newkey rsa:2048 \
            -keyout "$CERT_DIR/privkey.pem" \
            -out "$CERT_DIR/fullchain.pem" \
            -subj "/CN=litoraltrace.com" \
            -days 1 \
            >/dev/null 2>&1
          docker run --rm \
            --add-host app:127.0.0.1 \
            -v "$PWD/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$CERT_DIR:/etc/nginx/certs:ro" \
            nginx:1.25-alpine \
            nginx -t

      - name: Validate Prometheus configuration and alert rules
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --entrypoint /bin/promtool \
            -v "$PWD/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro" \
            prom/prometheus:v3.13.1 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm \
            --entrypoint /bin/promtool \
            -v "$PWD/monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro" \
            prom/prometheus:v3.13.1 \
            check rules /etc/prometheus/alert_rules.yml

      - name: Validate Alertmanager configuration
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --entrypoint /bin/amtool \
            -v "$PWD/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro" \
            prom/alertmanager:v0.33.1 \
            check-config /etc/alertmanager/alertmanager.yml
