name: CI

on:
  pull_request:
  push:
    branches:
      - p2-enterprise-production
      - p2-v1-closure
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p1a-navigation-contract-autofix:
    if: github.event_name == 'pull_request' && github.head_ref == 'p1a-integration-core-erp' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Update legacy navigation contracts
        run: python scripts/p1a_navigation_contract_fixes.py

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest alembic

      - name: Validate updated contracts
        env:
          ENVIRONMENT: test
          ENABLE_POSTGRES_TESTS: "0"
          TEST_DATABASE_URL: sqlite:///litoral_trace_test.db
          JWT_SECRET_KEY: ci-only-jwt-secret-key-1234567890
          LITORAL_TRACE_BOOTSTRAP_SUPERADMIN_PASSWORD: CiBootstrap-Password-1234567890!
        run: |
          python -m pytest -q \
            tests/test_batch_p24g_ui_unittest.py::test_navigation_keeps_existing_entries_and_superadmin_gets_imports \
            tests/test_frontend_p2fea_unittest.py::test_navigation_is_server_side_rbac_derived \
            tests/test_frontend_p2feb4_unittest.py::test_superadmin_navigation_contains_only_live_routes \
            tests/test_ci_p26a_unittest.py::test_p26a_ci_checks_single_canonical_alembic_head

      - name: Commit tested navigation contract updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tests/test_batch_p24g_ui_unittest.py \
            tests/test_frontend_p2fea_unittest.py \
            tests/test_frontend_p2feb4_unittest.py
          git diff --cached --quiet && { echo "No navigation contract changes to commit"; exit 0; }
          git commit -m "test(p1a): include integrations in navigation contracts"
          git push origin HEAD:p1a-integration-core-erp

  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENVIRONMENT: test
      ENABLE_POSTGRES_TESTS: "0"
      TEST_DATABASE_URL: sqlite:///litoral_trace_test.db
      JWT_SECRET_KEY: ci-only-jwt-secret-key-1234567890
      LITORAL_TRACE_BOOTSTRAP_SUPERADMIN_PASSWORD: CiBootstrap-Password-1234567890!
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest alembic

      - name: Python syntax gate
        run: python -m compileall main.py src tests

      - name: Alembic canonical head gate
        shell: bash
        run: |
          alembic heads | tee alembic-heads.txt
          if [ "$(wc -l < alembic-heads.txt)" -ne 1 ]; then
            echo "Expected exactly one Alembic head."
            exit 1
          fi
          grep -Fx "022_add_integration_history (head)" alembic-heads.txt

      - name: Run pytest suite
        run: python -m pytest -q -rs

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Verify tracked assets are reproducible
        run: git diff --exit-code

  production-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build -f Dockerfile -t litoral-trace-ci .

      - name: Validate production Compose syntax
        env:
          DATABASE_URL: postgresql+psycopg://runtime_user:ci-placeholder@db/appdb
          WORKER_DATABASE_URL: postgresql+psycopg://worker_user:ci-placeholder@db/appdb
          JWT_SECRET_KEY: ci-placeholder-jwt-secret-key
          STORAGE_BACKEND: s3
          STORAGE_BUCKET_NAME: ci-private-bucket
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-placeholder-postgres-password
          POSTGRES_DB: appdb
          OPS_ALERT_GITHUB_TOKEN: ci-placeholder-ops-token
        run: docker compose -f docker-compose.prod.yml config --quiet

      - name: Validate production Nginx configuration
        shell: bash
        run: |
          set -euo pipefail
          CERT_DIR="$RUNNER_TEMP/litoral-trace-nginx-certs"
          mkdir -p "$CERT_DIR"
          openssl req \
            -x509 \
            -nodes \
            -newkey rsa:2048 \
            -keyout "$CERT_DIR/privkey.pem" \
            -out "$CERT_DIR/fullchain.pem" \
            -subj "/CN=litoraltrace.com" \
            -days 1 \
            >/dev/null 2>&1
          docker run --rm \
            --add-host app:127.0.0.1 \
            -v "$PWD/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$CERT_DIR:/etc/nginx/certs:ro" \
            nginx:1.25-alpine \
            nginx -t

      - name: Validate Prometheus configuration and alert rules
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --entrypoint /bin/promtool \
            -v "$PWD/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro" \
            prom/prometheus:v3.13.1 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm \
            --entrypoint /bin/promtool \
            -v "$PWD/monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro" \
            prom/prometheus:v3.13.1 \
            check rules /etc/prometheus/alert_rules.yml

      - name: Validate Alertmanager configuration
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --entrypoint /bin/amtool \
            -v "$PWD/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro" \
            prom/alertmanager:v0.33.1 \
            check-config /etc/alertmanager/alertmanager.yml
