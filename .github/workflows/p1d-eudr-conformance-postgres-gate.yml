name: P1-D EUDR Conformance PostgreSQL Gate

on:
  pull_request:
    branches:
      - p2-enterprise-production
  push:
    branches:
      - p2-enterprise-production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1d-eudr-conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p1d-eudr-conformance-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: p1d_owner_password_2026
          POSTGRES_DB: litoral_trace_p1d_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d litoral_trace_p1d_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      ENVIRONMENT: development
      ENABLE_POSTGRES_TESTS: "1"
      JWT_SECRET_KEY: p1d-ci-only-jwt-secret-key-2026
      LITORAL_TRACE_BOOTSTRAP_SUPERADMIN_PASSWORD: P1dCiBootstrapPassword2026
      TEST_POSTGRES_MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:p1d_owner_password_2026@127.0.0.1:5432/litoral_trace_p1d_ci
      MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:p1d_owner_password_2026@127.0.0.1:5432/litoral_trace_p1d_ci
      TEST_POSTGRES_DATABASE_URL: postgresql+psycopg://litoral_trace_app:p1d_runtime_password_2026@127.0.0.1:5432/litoral_trace_p1d_ci
      DATABASE_URL: postgresql+psycopg://litoral_trace_app:p1d_runtime_password_2026@127.0.0.1:5432/litoral_trace_p1d_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest alembic

      - name: Gate P1-D - quarantine legacy automatic compliance claims
        run: |
          python -m pytest -q -rs \
            tests/test_p1d_legacy_compliance_quarantine_unittest.py \
            tests/test_intelligence_engine_unittest.py

      - name: Provision runtime principal
        shell: bash
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine

          engine = create_engine(
              os.environ["TEST_POSTGRES_MIGRATION_DATABASE_URL"],
              isolation_level="AUTOCOMMIT",
              pool_pre_ping=True,
              hide_parameters=True,
          )
          statements = [
              """
              CREATE ROLE litoral_trace_app
                LOGIN
                PASSWORD 'p1d_runtime_password_2026'
                NOSUPERUSER
                NOCREATEDB
                NOCREATEROLE
                NOINHERIT
                NOBYPASSRLS
              """,
              "GRANT CONNECT ON DATABASE litoral_trace_p1d_ci TO litoral_trace_app",
              "GRANT USAGE ON SCHEMA public TO litoral_trace_app",
          ]
          with engine.connect() as connection:
              for statement in statements:
                  connection.exec_driver_sql(statement)
          engine.dispose()
          PY

      - name: Migrate database to P1-D canonical head
        run: python -m alembic upgrade head

      - name: Provision reviewed source-lot read for fixture
        shell: bash
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine

          engine = create_engine(
              os.environ["TEST_POSTGRES_MIGRATION_DATABASE_URL"],
              isolation_level="AUTOCOMMIT",
              pool_pre_ping=True,
              hide_parameters=True,
          )
          with engine.connect() as connection:
              connection.exec_driver_sql(
                  "GRANT SELECT ON TABLE public.lotes TO litoral_trace_app"
              )
          engine.dispose()
          PY

      - name: Verify P1-D canonical revision
        shell: bash
        run: |
          set -euo pipefail
          python -m alembic current | tee p1d-alembic-current.txt
          grep -F "025_add_eudr_dds_candidates" p1d-alembic-current.txt

      - name: Write isolated runtime contract
        shell: bash
        run: |
          cat > .env.integration <<'EOF'
          ENABLE_POSTGRES_TESTS=1
          TEST_POSTGRES_DATABASE_URL=postgresql+psycopg://litoral_trace_app:p1d_runtime_password_2026@127.0.0.1:5432/litoral_trace_p1d_ci
          TEST_POSTGRES_MIGRATION_DATABASE_URL=postgresql+psycopg://postgres:p1d_owner_password_2026@127.0.0.1:5432/litoral_trace_p1d_ci
          EOF

      - name: Gate P1-D - conformance, determinism, tenant isolation and least privilege
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -rs \
            tests/test_eudr_dds_candidate_p1d_postgres_integration.py \
            --junitxml=p1d-eudr-conformance.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("p1d-eudr-conformance.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
          tests = sum(int(s.attrib.get("tests", "0")) for s in suites)
          skipped = sum(int(s.attrib.get("skipped", "0")) for s in suites)
          failures = sum(int(s.attrib.get("failures", "0")) for s in suites)
          errors = sum(int(s.attrib.get("errors", "0")) for s in suites)
          if tests != 1 or skipped or failures or errors:
              raise SystemExit(
                  "P1-D PostgreSQL gate fails closed: "
                  f"tests={tests}, skipped={skipped}, failures={failures}, errors={errors}"
              )
          PY

      - name: Cleanup isolated contract
        if: always()
        run: rm -f .env.integration
