name: Provision Worker DB Logins

on:
  push:
    branches:
      - ops/provision-worker-db-logins
    paths:
      - ".github/workflows/provision-worker-db-logins.yml"
      - ".github/scripts/provision_worker_db_logins.py"

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MIGRATION_DATABASE_URL: ${{ secrets.US_LACEY_NEON_MIGRATION_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install provisioning dependencies
        run: python -m pip install "psycopg[binary]>=3.2" "cryptography>=45"

      - name: Provision least-privilege worker login wrappers
        run: python .github/scripts/provision_worker_db_logins.py
