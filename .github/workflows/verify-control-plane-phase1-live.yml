name: Verify Control Plane Phase 1 Live

on:
  push:
    branches:
      - feature/control-plane-phase1-audit-billing
    paths:
      - .github/workflows/verify-control-plane-phase1-live.yml

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify production readiness and admin route
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN="https://lacey.litoraltrace.com"

          ready_code="$(curl -sS -D /tmp/ready.headers -o /tmp/ready.json -w '%{http_code}' --max-time 20 "$ORIGIN/ready")"
          test "$ready_code" = "200"
          python - <<'PY'
          import json
          from pathlib import Path
          body = json.loads(Path('/tmp/ready.json').read_text())
          assert body.get('status') == 'ready', body
          assert body.get('service') == 'us-lacey-pilot', body
          assert body.get('environment') == 'production', body
          assert body.get('hostname') == 'lacey.litoraltrace.com', body
          print('control_plane_ready=PASS')
          PY

          admin_code="$(curl -sS -D /tmp/admin.headers -o /tmp/admin.body -w '%{http_code}' --max-time 20 "$ORIGIN/admin")"
          test "$admin_code" = "303"
          grep -Eiq '^location: */login' /tmp/admin.headers
          if [ "$admin_code" = "500" ]; then
            echo "admin_route=FAIL_500"
            exit 1
          fi

          final_code="$(curl -sS -L -o /tmp/admin-final.html -w '%{http_code}' --max-time 20 "$ORIGIN/admin")"
          test "$final_code" = "200"
          grep -Fq 'U.S. Lacey Act workspace' /tmp/admin-final.html
          grep -Fq 'lang="en"' /tmp/admin-final.html
          echo 'admin_auth_guard=PASS'
          echo 'admin_redirect_target_render=PASS'

          health_code="$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 20 "$ORIGIN/health")"
          test "$health_code" = "200"
          echo 'control_plane_health=PASS'
