name: Inspect Worker Storage Binding

on:
  push:
    branches:
      - ops/provision-worker-db-logins
    paths:
      - ".github/workflows/inspect-worker-storage-binding.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      MIGRATION_DATABASE_URL: ${{ secrets.US_LACEY_NEON_MIGRATION_DATABASE_URL }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PostgreSQL driver
        run: python -m pip install "psycopg[binary]>=3.2"

      - name: Inspect non-secret storage binding
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          import psycopg

          with psycopg.connect(os.environ["MIGRATION_DATABASE_URL"]) as conn:
              conn.execute("SET TRANSACTION READ ONLY")
              row = conn.execute(
                  """
                  SELECT storage_bucket, object_key
                  FROM public.vault_documents
                  WHERE status = 'available'
                    AND storage_backend = 's3'
                    AND storage_bucket IS NOT NULL
                    AND object_key IS NOT NULL
                  ORDER BY id DESC
                  LIMIT 1
                  """
              ).fetchone()
              if row is None:
                  raise RuntimeError("No available S3-backed Vault document found.")
              bucket, object_key = row
              marker = "/tenants/"
              prefix = object_key.split(marker, 1)[0] if marker in object_key else ""
              print("STORAGE_BINDING=" + json.dumps({
                  "bucket": bucket,
                  "prefix": prefix,
              }, sort_keys=True))
              conn.rollback()
          PY
