name: Ops - Northflank price 149

on:
  push:
    branches:
      - ops/northflank-price-149-20260925
    paths:
      - .github/workflows/ops-northflank-price-149.yml

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NORTHFLANK_API_KEY: ${{ secrets.NORTHFLANK_API_KEY }}
    steps:
      - name: Validate secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NORTHFLANK_API_KEY"
          echo "Northflank secret available."

      - name: Install Northflank CLI
        run: npm install --global @northflank/cli@0.13.0

      - name: Authenticate
        shell: bash
        run: northflank login -n ci -t "$NORTHFLANK_API_KEY" >/dev/null

      - name: Update existing portal runtime price
        shell: bash
        run: |
          set -euo pipefail

          existing="$(northflank list secrets --project litoral-trace -o json --quiet)"
          secret_id="$(printf '%s' "$existing" | python -c 'import sys,json; d=json.load(sys.stdin); print(next((x.get("id","") for x in d.get("secrets",[]) if x.get("name")=="Litoral Trace Portal Runtime"), ""))')"
          test -n "$secret_id"

          northflank get secret --projectId=litoral-trace --secretId="$secret_id" -o json --quiet > /tmp/portal-runtime.json

          python - <<'PY'
          import json
          path="/tmp/portal-runtime.json"
          with open(path, encoding="utf-8") as f:
              payload=json.load(f)

          variables=None
          if isinstance(payload.get("secrets"), dict) and isinstance(payload["secrets"].get("variables"), dict):
              variables=payload["secrets"]["variables"]
          elif isinstance(payload.get("variables"), dict):
              variables=payload["variables"]

          if variables is None:
              raise RuntimeError("Unexpected Northflank secret shape.")

          variables["US_LACEY_PRIVATE_BETA_PRICE_CENTS"]="14900"

          with open(path, "w", encoding="utf-8") as f:
              json.dump(payload, f)
          PY

          northflank patch secret --projectId=litoral-trace --secretId="$secret_id" -f /tmp/portal-runtime.json --quiet >/dev/null
          rm -f /tmp/portal-runtime.json
          echo "Portal runtime price set to 14900 cents."

      - name: Restart web
        shell: bash
        run: |
          set -euo pipefail
          northflank restart service --projectId=litoral-trace --serviceId=litoral-trace-web --quiet >/dev/null
          echo "Web restarted."
