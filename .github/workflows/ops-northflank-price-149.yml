name: Ops - Northflank price 149

on:
  push:
    branches:
      - ops/northflank-price-149-20260925
    paths:
      - .github/workflows/ops-northflank-price-149.yml

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NORTHFLANK_API_KEY: ${{ secrets.NORTHFLANK_API_KEY }}
    steps:
      - name: Validate secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NORTHFLANK_API_KEY"
          echo "Northflank secret available."

      - name: Install Northflank CLI
        run: npm install --global @northflank/cli@0.13.0

      - name: Authenticate
        shell: bash
        run: northflank login -n ci -t "$NORTHFLANK_API_KEY" >/dev/null

      - name: Apply USD 149 runtime override
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          payload = {
              "name": "Litoral Trace Price 149 Runtime",
              "description": "Commercial price override for U.S. Lacey Early Access",
              "type": "secret",
              "secretType": "environment",
              "priority": 110,
              "restrictions": {
                  "restricted": True,
                  "nfObjects": [{"id": "litoral-trace-web", "type": "service"}],
                  "tagMatchCondition": "or",
              },
              "secrets": {
                  "variables": {
                      "US_LACEY_PRIVATE_BETA_PRICE_CENTS": "14900"
                  }
              },
          }
          with open("/tmp/lt-price-149.json", "w", encoding="utf-8") as fh:
              json.dump(payload, fh)
          PY

          existing="$(northflank list secrets --project litoral-trace -o json --quiet)"
          secret_id="$(printf '%s' "$existing" | python -c 'import sys,json; d=json.load(sys.stdin); print(next((x.get("id","") for x in d.get("secrets",[]) if x.get("name")=="Litoral Trace Price 149 Runtime"), ""))')"

          if [ -n "$secret_id" ]; then
            northflank patch secret --projectId=litoral-trace --secretId="$secret_id" -f /tmp/lt-price-149.json --quiet >/dev/null
          else
            northflank create secret --project litoral-trace -f /tmp/lt-price-149.json --quiet >/dev/null
          fi

          rm -f /tmp/lt-price-149.json
          echo "Price override set to 14900 cents."

      - name: Restart web
        shell: bash
        run: |
          set -euo pipefail
          northflank restart service --projectId=litoral-trace --serviceId=litoral-trace-web --quiet >/dev/null
          echo "Web restarted."
