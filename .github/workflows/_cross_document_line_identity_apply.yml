name: Apply cross-document line identity patch

on:
  push:
    branches:
      - fix/us-lacey-cross-document-line-identity
    paths:
      - .github/workflows/_cross_document_line_identity_apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/us-lacey-cross-document-line-identity
      - name: Apply source patch
        run: python scripts/_apply_cross_document_line_identity_patch.py
      - name: Commit generated source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: wire cross-document line identity into canonical truth"
          git push origin HEAD:fix/us-lacey-cross-document-line-identity
