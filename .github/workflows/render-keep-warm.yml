name: Render Keep Warm

# Private-repository pre-revenue mode:
# keep this workflow manual-only so GitHub-hosted runner usage cannot be
# consumed every five minutes just to prevent Render Free from sleeping.
# Before a live demo, dispatch this workflow or open litoraltrace.com once.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-keep-warm
  cancel-in-progress: true

jobs:
  ping:
    name: ping-litoraltrace-health
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake and verify public health endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --max-time 90 \
            --retry 2 \
            --retry-delay 5 \
            --retry-all-errors \
            https://litoraltrace.com/health \
            >/dev/null
