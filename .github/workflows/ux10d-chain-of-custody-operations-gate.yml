name: UX10 Chain of Custody Operations Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ux10d-operations-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ux10d-chain-of-custody-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ENVIRONMENT: test
      ENABLE_POSTGRES_TESTS: "0"
      TEST_DATABASE_URL: sqlite:///litoral_trace_test.db
      JWT_SECRET_KEY: ci-only-jwt-secret-key-1234567890
      LITORAL_TRACE_BOOTSTRAP_SUPERADMIN_PASSWORD: CiBootstrap-Password-1234567890!
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Inspect UX10-D route registration
        run: |
          python - <<'PY'
          from litoral_trace.web.traceability_operations import router as operations_router
          from litoral_trace.api.traceability import router as traceability_router
          print("operations_router:", [(getattr(r, "path", None), sorted(getattr(r, "methods", set()) or set())) for r in operations_router.routes])
          print("traceability_router:", [(getattr(r, "path", None), sorted(getattr(r, "methods", set()) or set())) for r in traceability_router.routes if str(getattr(r, "path", "")).startswith("/operations")])
          PY

      - name: UX10-D operational acceptance
        run: |
          python -m pytest -q -rs \
            tests/test_ux10d_traceability_operations_unittest.py \
            tests/test_traceability_p1b_unittest.py \
            --junitxml=ux10d-operations.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("ux10d-operations.xml").getroot()
          attrs = root.attrib
          skipped = int(attrs.get("skipped", 0))
          failures = int(attrs.get("failures", 0))
          errors = int(attrs.get("errors", 0))
          if skipped or failures or errors:
              raise SystemExit(
                  f"UX10-D fails closed: skipped={skipped}, failures={failures}, errors={errors}"
              )
          PY
