name: UX10 Chain of Custody Operations Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ux10d-operations-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ux10d-chain-of-custody-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ENVIRONMENT: test
      ENABLE_POSTGRES_TESTS: "0"
      TEST_DATABASE_URL: sqlite:///litoral_trace_test.db
      JWT_SECRET_KEY: ci-only-jwt-secret-key-1234567890
      LITORAL_TRACE_BOOTSTRAP_SUPERADMIN_PASSWORD: CiBootstrap-Password-1234567890!
      PYTHONPATH: src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      # FastAPI 0.141 can keep included routers behind internal routing nodes,
      # so acceptance verifies public URL resolution plus the operational
      # router's declared method/path contract instead of relying on the
      # private shape of ``app.routes``.
      - name: UX10-D cold-start route resolution
        run: |
          python - <<'PY'
          import main
          from litoral_trace.web.traceability_operations import router as operations_router

          expected_declared = {
              ("/operations", ("GET",)),
              ("/operations/receipts", ("POST",)),
              ("/operations/processes", ("POST",)),
              ("/operations/events/{event_public_id}/post", ("POST",)),
              ("/operations/shipments", ("POST",)),
              ("/operations/shipments/{shipment_public_id}/dispatch", ("POST",)),
          }
          declared = {
              (route.path, tuple(sorted(route.methods or set())))
              for route in operations_router.routes
              if getattr(route, "path", "").startswith("/operations")
          }
          if declared != expected_declared:
              raise SystemExit(
                  f"UX10-D declared route mismatch: expected={sorted(expected_declared)!r} actual={sorted(declared)!r}"
              )

          resolved = {
              str(main.app.url_path_for("render_traceability_operations")),
              str(main.app.url_path_for("create_receipt_operation")),
              str(main.app.url_path_for("create_process_operation")),
              str(
                  main.app.url_path_for(
                      "post_existing_event_operation",
                      event_public_id="00000000-0000-0000-0000-000000000001",
                  )
              ),
              str(main.app.url_path_for("create_shipment_operation")),
              str(
                  main.app.url_path_for(
                      "dispatch_existing_shipment_operation",
                      shipment_public_id="00000000-0000-0000-0000-000000000002",
                  )
              ),
          }
          expected_resolved = {
              "/operations",
              "/operations/receipts",
              "/operations/processes",
              "/operations/events/00000000-0000-0000-0000-000000000001/post",
              "/operations/shipments",
              "/operations/shipments/00000000-0000-0000-0000-000000000002/dispatch",
          }
          if resolved != expected_resolved:
              raise SystemExit(
                  f"UX10-D cold-start URL resolution mismatch: expected={sorted(expected_resolved)!r} actual={sorted(resolved)!r}"
              )
          PY

      - name: UX10-D operational acceptance
        run: |
          python -m pytest -q -rs \
            tests/test_ux10d_traceability_operations_unittest.py \
            tests/test_traceability_p1b_unittest.py \
            --junitxml=ux10d-operations.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("ux10d-operations.xml").getroot()
          attrs = root.attrib
          skipped = int(attrs.get("skipped", 0))
          failures = int(attrs.get("failures", 0))
          errors = int(attrs.get("errors", 0))
          if skipped or failures or errors:
              raise SystemExit(
                  f"UX10-D fails closed: skipped={skipped}, failures={failures}, errors={errors}"
              )
          PY
