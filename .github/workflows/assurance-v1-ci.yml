name: Assurance v1 CI

on:
  push:
    branches:
      - feature/assurance-v1
  pull_request:
    branches:
      - main

jobs:
  assurance-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Assurance v1 contract tests
        env:
          PYTHONPATH: src
        run: |
          pytest -q \
            tests/test_assurance_feature_flags.py \
            tests/test_assurance_metrics.py \
            tests/test_assurance_document_model.py \
            tests/test_document_ingestion.py
