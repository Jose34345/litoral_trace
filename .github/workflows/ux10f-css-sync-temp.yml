name: UX10-F CSS Sync Temp

on:
  pull_request:

permissions:
  contents: write

jobs:
  sync-css:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ux10-f-litoral-trace-release-control'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Build canonical frontend assets
        run: |
          npm ci
          npm run build

      - name: Commit generated CSS and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/litoral_trace/static/dist/app.css
          git rm .github/workflows/ux10f-css-sync-temp.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Sync UX10-F Tailwind assets"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
