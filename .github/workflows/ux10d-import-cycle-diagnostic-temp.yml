name: UX10D Import Cycle Diagnostic Temp

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose-import-cycle:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      ENABLE_POSTGRES_TESTS: "0"
      TEST_DATABASE_URL: sqlite:///litoral_trace_test.db
      JWT_SECRET_KEY: ci-only-jwt-secret-key-1234567890
      LITORAL_TRACE_BOOTSTRAP_SUPERADMIN_PASSWORD: CiBootstrap-Password-1234567890!
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4

      - name: Find source-level imports of main
        run: |
          echo '=== imports of main ==='
          grep -RInE '(^|[[:space:]])(from[[:space:]]+main([[:space:]]|$)|import[[:space:]]+main([[:space:]]|$))' src tests . --exclude-dir=.git --exclude='ux10d-import-cycle-diagnostic-temp.yml' || true
          echo '=== traceability operations references ==='
          grep -RIn 'traceability_operations' src tests main.py --exclude-dir=.git || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt

      - name: Inspect import identities and route snapshots
        run: |
          python - <<'PY'
          import main
          import litoral_trace.web.router as wr
          import litoral_trace.web.traceability_operations as ops

          def routes(router):
              return [
                  (getattr(r, "path", None), sorted(getattr(r, "methods", set()) or set()))
                  for r in router.routes
                  if str(getattr(r, "path", "")).startswith("/operations")
              ]

          print("OPS_MODULE_FILE", ops.__file__)
          print("MAIN_ROUTER_IS_OPS", main.traceability_operations_router is ops.router)
          print("WEB_ROUTER_ROUTES", routes(wr.router))
          print("MAIN_ROUTER_ROUTES", routes(main.traceability_operations_router))
          print("OPS_ROUTER_ROUTES", routes(ops.router))
          print("APP_ROUTES", [
              (getattr(r, "path", None), sorted(getattr(r, "methods", set()) or set()))
              for r in main.app.routes
              if str(getattr(r, "path", "")).startswith("/operations")
          ])
          PY
