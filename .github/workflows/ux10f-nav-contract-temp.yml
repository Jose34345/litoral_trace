name: UX10-F Nav Contract Temp

on:
  pull_request:

permissions:
  contents: write

jobs:
  update-contracts:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ux10-f-litoral-trace-release-control'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Update navigation contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('tests/test_batch_p24g_ui_unittest.py'): [
                  (
                      '("traceability", "/traceability"),\n        ("vault", "/vault"),',
                      '("traceability", "/traceability"),\n        ("release_control", "/release-control"),\n        ("vault", "/vault"),',
                  ),
              ],
              Path('tests/test_frontend_p2fea_unittest.py'): [
                  (
                      '"dashboard",\n        "traceability",\n        "vault",',
                      '"dashboard",\n        "traceability",\n        "release_control",\n        "vault",',
                  ),
                  (
                      '"dashboard",\n        "imports",\n        "traceability",\n        "vault",\n        "settings",',
                      '"dashboard",\n        "imports",\n        "traceability",\n        "release_control",\n        "vault",\n        "settings",',
                  ),
              ],
              Path('tests/test_frontend_p2feb4_unittest.py'): [
                  (
                      '("traceability", "/traceability"),\n        ("vault", "/vault"),',
                      '("traceability", "/traceability"),\n        ("release_control", "/release-control"),\n        ("vault", "/vault"),',
                  ),
              ],
          }

          for path, changes in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in changes:
                  if old not in text:
                      raise SystemExit(f'Anchor not found in {path}: {old!r}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Verify targeted navigation tests
        run: |
          python -m pip install -r requirements.txt pytest >/dev/null
          PYTHONPATH=src python -m pytest -q \
            tests/test_batch_p24g_ui_unittest.py \
            tests/test_frontend_p2fea_unittest.py \
            tests/test_frontend_p2feb4_unittest.py

      - name: Commit contracts and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_batch_p24g_ui_unittest.py tests/test_frontend_p2fea_unittest.py tests/test_frontend_p2feb4_unittest.py
          git rm .github/workflows/ux10f-nav-contract-temp.yml
          git commit -m "Align navigation contracts with UX10-F"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
