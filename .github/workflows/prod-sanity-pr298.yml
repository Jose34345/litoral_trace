name: PR298 Production Sanity

on:
  push:
    branches:
      - ops/prod-sanity-pr298
    paths:
      - scripts/prod_sanity_pr298.py
      - .github/workflows/prod-sanity-pr298.yml

permissions:
  contents: read

jobs:
  prod-sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out sanity branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Run production Golden Fixture sanity
        run: python scripts/prod_sanity_pr298.py

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr298-production-sanity
          path: artifacts/prod-sanity-pr298/
          if-no-files-found: warn
          retention-days: 3
