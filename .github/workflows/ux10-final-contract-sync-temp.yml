name: UX10 Final Contract Sync Temp

on:
  push:
    branches:
      - ux10-a-spanish-language

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ux10-a-spanish-language
          fetch-depth: 0
      - name: Align final batch presentation contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_batch_p24g_ui_unittest.py')
          text = path.read_text(encoding='utf-8')
          old = 'assert "Desvincular evidencia" in detail_template'
          new = 'assert "Desvincular documento" in detail_template'
          if old not in text:
              raise SystemExit('Expected legacy assertion not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit synced contract
        shell: bash
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_batch_p24g_ui_unittest.py
          git commit -m 'test(ux10): align final batch detail copy'
          git push origin HEAD:ux10-a-spanish-language
