name: P1-A Integration Core Finalizer
# registered-trigger: 2026-08-22

on:
  push:
    branches:
      - p1a-integration-core-erp
    paths:
      - "scripts/p1a_finalize.py"
      - ".github/workflows/p1a-finalize.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p1a-integration-core-erp
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Apply deterministic P1-A finalizer
        run: python scripts/p1a_finalize.py

      - name: Install dependencies
        run: |
          python -m pip install --quiet -r requirements.txt pytest
          npm ci

      - name: Build tracked frontend assets
        run: npm run build

      - name: Run P1-A and existing operations regressions
        env:
          PYTHONPATH: src
          ENVIRONMENT: test
          TEST_DATABASE_URL: sqlite:///litoral_trace_test.db
          JWT_SECRET_KEY: ci-only-jwt-secret-key-1234567890
        run: |
          python -m pytest -q \
            tests/test_p1a_integration_core_unittest.py \
            tests/test_p1a_integration_models_unittest.py \
            tests/test_ux10d_traceability_operations_unittest.py \
            tests/test_operations_ux12_unittest.py

      - name: Import application
        env:
          PYTHONPATH: src
          ENVIRONMENT: test
          TEST_DATABASE_URL: sqlite:///litoral_trace_test.db
          JWT_SECRET_KEY: ci-only-jwt-secret-key-1234567890
        run: python -c "import main; print('P1A_MAIN_IMPORT_OK', len(main.app.routes))"

      - name: Commit finalized product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            alembic/versions/021_add_integration_core.py \
            src/litoral_trace/services/integrations/core.py \
            src/litoral_trace/api/integrations.py \
            src/litoral_trace/web/integrations.py \
            src/litoral_trace/templates/app/base_app.html \
            src/litoral_trace/static/dist/app.css \
            tests/test_p1a_integration_core_unittest.py \
            tests/test_p1a_integration_models_unittest.py
          git diff --cached --quiet && { echo "No finalizer changes to commit"; exit 0; }
          git commit -m "feat(p1a): finalize auditable ERP staging core"
          git push origin HEAD:p1a-integration-core-erp
