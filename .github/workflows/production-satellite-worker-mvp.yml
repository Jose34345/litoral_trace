name: Production Satellite Worker MVP

# Zero-fixed-cost worker topology used only before the first paying customer.
# Private-repository pre-revenue cadence is intentionally hourly to preserve
# GitHub Actions included minutes. Commercial trigger: issue #67. Migrate to a
# persistent Render Background Worker + Neon restore history >=7d before
# expanding paid production usage.
on:
  schedule:
    # Hourly at :07 UTC while the repository is private and pre-revenue.
    - cron: "7 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/production-satellite-worker-mvp.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: production-satellite-worker-mvp
  cancel-in-progress: false

jobs:
  worker:
    name: one-shot production satellite worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      WORKERS_ENABLED: "1"
      PYTHONPATH: src
      DATABASE_URL: ${{ secrets.LT_PROD_DATABASE_URL }}
      WORKER_DATABASE_URL: ${{ secrets.LT_PROD_WORKER_DATABASE_URL }}
      GCP_PROJECT_ID: ${{ secrets.LT_GCP_PROJECT_ID || 'litoral-trace-engine' }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.LT_GCP_SERVICE_ACCOUNT }}
      SATELLITE_WORKER_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
      SATELLITE_WORKER_HEARTBEAT_SECONDS: "15"
      SATELLITE_WORKER_STALE_RECOVERY_INTERVAL_SECONDS: "30"
      SATELLITE_WORKER_RETRY_BASE_SECONDS: "30"
      SATELLITE_WORKER_RETRY_MAX_SECONDS: "900"
      SATELLITE_METRICS_ENABLED: "0"
      SATELLITE_QUEUE_METRICS_REFRESH_SECONDS: "30"

    steps:
      - name: Verify production secret contract
        id: config
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in DATABASE_URL WORKER_DATABASE_URL GCP_SERVICE_ACCOUNT; do
            if [ -z "${!name:-}" ]; then
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Required production worker secrets are unavailable."
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "Production worker secret contract is present."

      - name: Ensure PostgreSQL client is available
        if: steps.config.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi

      - name: Inspect durable queue using worker capability only
        if: steps.config.outputs.configured == 'true'
        id: queue
        shell: bash
        run: |
          set -euo pipefail
          worker_psql_url="$WORKER_DATABASE_URL"
          worker_psql_url="${worker_psql_url/postgresql+psycopg:\/\//postgresql:\/\/}"
          snapshot="$(psql "$worker_psql_url" -X -qAt -F '|' -v ON_ERROR_STOP=1 -c \
            "SELECT queued_ready_count::int, running_stale_count::int, queued_delayed_count::int FROM public.worker_get_satellite_queue_metrics();")"
          IFS='|' read -r queued_ready running_stale queued_delayed <<< "$snapshot"
          queued_ready="${queued_ready:-0}"
          running_stale="${running_stale:-0}"
          queued_delayed="${queued_delayed:-0}"
          echo "queued_ready=$queued_ready" >> "$GITHUB_OUTPUT"
          echo "running_stale=$running_stale" >> "$GITHUB_OUTPUT"
          echo "queued_delayed=$queued_delayed" >> "$GITHUB_OUTPUT"
          if [ "$queued_ready" -gt 0 ] || [ "$running_stale" -gt 0 ]; then
            echo "needs_work=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_work=false" >> "$GITHUB_OUTPUT"
            echo "No ready or stale production satellite job requires execution."
          fi

      - name: Checkout deployed application line
        if: steps.queue.outputs.needs_work == 'true'
        uses: actions/checkout@v4
        with:
          ref: p2-enterprise-production
          persist-credentials: false

      - name: Setup Python
        if: steps.queue.outputs.needs_work == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install worker runtime dependencies
        if: steps.queue.outputs.needs_work == 'true'
        run: python -m pip install --disable-pip-version-check --quiet -r requirements.txt

      - name: Fail-closed Google Earth Engine preflight
        if: steps.queue.outputs.needs_work == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import ee

          payload = json.loads(os.environ["GCP_SERVICE_ACCOUNT"])
          credentials = ee.ServiceAccountCredentials(
              payload["client_email"],
              key_data=payload["private_key"],
          )
          ee.Initialize(credentials, project=os.environ["GCP_PROJECT_ID"])
          print("GEE preflight OK")
          PY

      - name: Fail-closed worker readiness check
        if: steps.queue.outputs.needs_work == 'true'
        run: python -m litoral_trace.workers.satellite_worker --check

      - name: Claim and execute at most one durable job
        if: steps.queue.outputs.needs_work == 'true'
        id: execute
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=60s 22m \
            python -m litoral_trace.workers.satellite_worker --once

      - name: Capture sanitized queue state
        if: always() && steps.config.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          worker_psql_url="$WORKER_DATABASE_URL"
          worker_psql_url="${worker_psql_url/postgresql+psycopg:\/\//postgresql:\/\/}"
          snapshot="$(psql "$worker_psql_url" -X -qAt -F '|' -v ON_ERROR_STOP=1 -c \
            "SELECT queued_ready_count::int, queued_delayed_count::int, running_count::int, running_stale_count::int FROM public.worker_get_satellite_queue_metrics();")"
          IFS='|' read -r queued_ready queued_delayed running running_stale <<< "$snapshot"
          {
            echo "### Production satellite worker MVP"
            echo ""
            echo "- execution requested: ${{ steps.queue.outputs.needs_work || 'false' }}"
            echo "- queued ready: ${queued_ready:-unknown}"
            echo "- queued delayed: ${queued_delayed:-unknown}"
            echo "- running: ${running:-unknown}"
            echo "- running stale: ${running_stale:-unknown}"
            echo "- run: $GITHUB_RUN_ID / attempt $GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update worker incident on failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="[ops] Production satellite worker MVP failure"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "${title} in:title" --json number,title --jq '.[] | select(.title == "[ops] Production satellite worker MVP failure") | .number' | head -n1)"
          body="Production satellite worker failed on GitHub Actions run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}. No credentials are included. Review the Actions run and durable queue state."
          if [ -z "$existing" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          else
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          fi

      - name: Close worker incident after recovery
        if: success() && steps.queue.outputs.needs_work == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="[ops] Production satellite worker MVP failure"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "${title} in:title" --json number,title --jq '.[] | select(.title == "[ops] Production satellite worker MVP failure") | .number' | head -n1)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Worker recovered successfully on Actions run ${GITHUB_RUN_ID}. Closing incident."
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" --reason completed
          fi
