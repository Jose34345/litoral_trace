name: UX10D Late Import Fix Temp

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch-late-import:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Make UX10-D registration strictly late-bound
        run: |
          python - <<'PY'
          from pathlib import Path

          web_path = Path("src/litoral_trace/web/router.py")
          web_text = web_path.read_text(encoding="utf-8")
          old_web = '''\n\n# UX10-D_OPERATION_ROUTER_REGISTRATION\n# Keep operational HTML composition in the web layer. The late import avoids\n# coupling ``api.traceability`` back into server-rendered write workflows.\nfrom litoral_trace.web.traceability_operations import (\n    router as traceability_operations_router,\n)\n\nrouter.include_router(traceability_operations_router)'''
          if old_web not in web_text:
              raise SystemExit("web router UX10-D registration block not found")
          web_path.write_text(web_text.replace(old_web, "", 1), encoding="utf-8")

          main_path = Path("main.py")
          main_text = main_path.read_text(encoding="utf-8")
          old_import = '''from litoral_trace.web.router import (\n    router as web_router,\n)\nfrom litoral_trace.web.traceability_operations import (\n    router as traceability_operations_router,\n)\n\nfrom litoral_trace.web.runtime import (\n'''
          new_import = '''from litoral_trace.web.router import (\n    router as web_router,\n)\n\nfrom litoral_trace.web.runtime import (\n'''
          if old_import not in main_text:
              raise SystemExit("main eager operations import block not found")
          main_text = main_text.replace(old_import, new_import, 1)

          old_registration = '''app.include_router(\n    web_router\n)\n\n# UX10-D is a write workspace owned by the web layer. ``web_router`` can be\n# imported while the operational submodule is still initializing, and\n# APIRouter.include_router() copies routes eagerly. Register the completed\n# operational router here only when that earlier copy did not materialize.\nif not any(\n    getattr(route, "path", "") == "/operations"\n    for route in app.routes\n):\n    app.include_router(\n        traceability_operations_router\n    )\n'''
          new_registration = '''app.include_router(\n    web_router\n)\n\n# UX10-D owns write routes and imports ``web.runtime``. Import it only after\n# the primary web router and the application bootstrap are fully initialized.\n# FastAPI copies APIRouter routes eagerly, so this strict late binding prevents\n# a partially initialized operational router from being snapshotted as empty.\nfrom litoral_trace.web.traceability_operations import (\n    router as traceability_operations_router,\n)\n\napp.include_router(\n    traceability_operations_router\n)\n'''
          if old_registration not in main_text:
              raise SystemExit("main UX10-D registration block not found")
          main_path.write_text(main_text.replace(old_registration, new_registration, 1), encoding="utf-8")
          PY

      - name: Remove temporary diagnostics and commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/ux10d-import-cycle-diagnostic-temp.yml
          rm -f .github/workflows/ux10d-late-import-fix-temp.yml
          git add -- main.py src/litoral_trace/web/router.py .github/workflows/ux10d-import-cycle-diagnostic-temp.yml .github/workflows/ux10d-late-import-fix-temp.yml
          git commit -m "fix(ux10d): late-bind operational router after web bootstrap"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
