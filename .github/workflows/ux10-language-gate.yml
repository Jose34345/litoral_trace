name: UX10 Spanish Product Language Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ux10-language-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ux10a-language-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENVIRONMENT: test
      ENABLE_POSTGRES_TESTS: "0"
      TEST_DATABASE_URL: sqlite:///litoral_trace_test.db
      JWT_SECRET_KEY: ci-only-jwt-secret-key-1234567890
      LITORAL_TRACE_BOOTSTRAP_SUPERADMIN_PASSWORD: CiBootstrap-Password-1234567890!
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: UX10-A Spanish product language acceptance
        run: |
          python -m pytest -q -rs tests/test_ux10a_language_unittest.py --junitxml=ux10a-language.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("ux10a-language.xml").getroot()
          attrs = root.attrib
          skipped = int(attrs.get("skipped", 0))
          failures = int(attrs.get("failures", 0))
          errors = int(attrs.get("errors", 0))
          if skipped or failures or errors:
              raise SystemExit(
                  f"UX10-A fails closed: skipped={skipped}, failures={failures}, errors={errors}"
              )
          PY
