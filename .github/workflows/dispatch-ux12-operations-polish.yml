name: Dispatch UX12 Operations Polish

# Explicit one-shot trigger after the dispatcher was made valid on main.
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dispatch-ux12-operations-polish.yml"
      - "scripts/ops_apply_ux12.py"

permissions:
  contents: write
  issues: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout operator scripts
        uses: actions/checkout@v4
        with:
          ref: main
          path: operator
          persist-credentials: false

      - name: Checkout UX12 product branch
        uses: actions/checkout@v4
        with:
          ref: ux12-operations-responsive-picker
          path: product
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: product/package-lock.json

      - name: Apply patch
        run: python operator/scripts/ops_apply_ux12.py product

      - name: Build tracked frontend assets
        working-directory: product
        run: |
          npm ci
          npm run build

      - name: Run targeted regression
        working-directory: product
        run: |
          python -m pip install --quiet -r requirements.txt pytest
          PYTHONPATH=src ENVIRONMENT=test TEST_DATABASE_URL=sqlite:///litoral_trace_test.db JWT_SECRET_KEY=ci-only-jwt-secret-key-1234567890 \
            python -m pytest -q tests/test_operations_ux12_unittest.py tests/test_ux10d_traceability_operations_unittest.py

      - name: Commit tested UX12 patch
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/litoral_trace/templates/traceability_operations.html \
                  src/litoral_trace/static/src/js/app.js \
                  src/litoral_trace/static/dist/app.css \
                  tests/test_operations_ux12_unittest.py
          git commit -m "feat: polish responsive operations batch selection"
          git push origin HEAD:ux12-operations-responsive-picker

      - name: Report dispatcher outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 48 --repo Jose34345/litoral_trace --body "### UX12 operations polish dispatcher — ${{ job.status }}\n\nResponsive layout + enhanced batch picker + progressive shipment rows. No ledger/database changes."
