name: US Lacey Neon Schema Gate

on:
  push:
    branches:
      - feature/us-lacey-pilot-platform
  workflow_dispatch:
    inputs:
      mode:
        description: "inspect = read-only verification; migrate = upgrade then verify"
        required: true
        default: inspect
        type: choice
        options:
          - inspect
          - migrate

permissions:
  contents: read

concurrency:
  group: us-lacey-neon-schema-gate
  cancel-in-progress: false

jobs:
  neon-schema-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENVIRONMENT: production
      MIGRATION_DATABASE_URL: ${{ secrets.US_LACEY_NEON_MIGRATION_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install migration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt alembic

      - name: Require isolated migration secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${MIGRATION_DATABASE_URL:-}" ]; then
            echo "Missing GitHub secret US_LACEY_NEON_MIGRATION_DATABASE_URL"
            exit 1
          fi
          echo "Migration connection is configured in GitHub Actions (value not printed)."

      - name: Resolve repository canonical schema head
        shell: bash
        run: |
          set -euo pipefail
          REQUIRED_SCHEMA_REVISION="$(python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory

          script = ScriptDirectory.from_config(Config("alembic.ini"))
          heads = tuple(script.get_heads())
          if len(heads) != 1:
              raise SystemExit(f"Expected exactly one Alembic head; found {len(heads)}")
          print(heads[0])
          PY
          )"
          test -n "$REQUIRED_SCHEMA_REVISION"
          echo "REQUIRED_SCHEMA_REVISION=$REQUIRED_SCHEMA_REVISION" >> "$GITHUB_ENV"
          echo "repository_schema_head=$REQUIRED_SCHEMA_REVISION"

      - name: Resolve safe release mode
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            MODE="migrate"
          else
            MODE="${{ inputs.mode }}"
          fi
          case "$MODE" in
            inspect|migrate) ;;
            *) echo "Invalid mode: $MODE"; exit 1 ;;
          esac
          echo "US_LACEY_NEON_MODE=$MODE" >> "$GITHUB_ENV"
          echo "resolved_mode=$MODE"

      - name: Inspect persistent Neon before changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          from sqlalchemy.engine import make_url

          url = make_url(os.environ["MIGRATION_DATABASE_URL"])
          if url.drivername in {"postgresql", "postgres", "postgresql+psycopg2"}:
              url = url.set(drivername="postgresql+psycopg")
          engine = create_engine(url, pool_pre_ping=True, hide_parameters=True)
          with engine.connect() as conn:
              user = conn.execute(text("select current_user")).scalar_one()
              if user in {"litoral_trace_app", "litoral_trace_us_lacey_worker"}:
                  raise SystemExit("Refusing schema gate with runtime/worker role")
              version = conn.execute(text("select version_num from alembic_version")).scalar_one()
              print(f"database_schema_before={version}")
              print(f"migration_role={user}")
          engine.dispose()
          PY

      - name: Migrate persistent Neon to repository head
        if: ${{ env.US_LACEY_NEON_MODE == 'migrate' }}
        run: python -m alembic upgrade head

      - name: Verify exact schema and least-privilege metadata access
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          from sqlalchemy.engine import make_url

          required = os.environ["REQUIRED_SCHEMA_REVISION"]
          url = make_url(os.environ["MIGRATION_DATABASE_URL"])
          if url.drivername in {"postgresql", "postgres", "postgresql+psycopg2"}:
              url = url.set(drivername="postgresql+psycopg")
          engine = create_engine(url, pool_pre_ping=True, hide_parameters=True)
          with engine.connect() as conn:
              version = conn.execute(text("select version_num from alembic_version")).scalar_one()
              if version != required:
                  raise SystemExit(
                      f"Schema drift: database={version} repository={required}"
                  )

              roles = {
                  row.rolname: (row.rolsuper, row.rolbypassrls)
                  for row in conn.execute(text("""
                      select rolname, rolsuper, rolbypassrls
                      from pg_roles
                      where rolname in (
                          'litoral_trace_app',
                          'litoral_trace_us_lacey_worker'
                      )
                  """))
              }
              expected = {"litoral_trace_app", "litoral_trace_us_lacey_worker"}
              if set(roles) != expected:
                  raise SystemExit(f"Missing runtime roles: {sorted(expected - set(roles))}")
              for role, (superuser, bypassrls) in roles.items():
                  if superuser or bypassrls:
                      raise SystemExit(f"Unsafe role attributes for {role}")

              runtime_select = conn.execute(text(
                  "select has_table_privilege("
                  "'litoral_trace_app','public.alembic_version','SELECT')"
              )).scalar_one()
              worker_select = conn.execute(text(
                  "select has_table_privilege("
                  "'litoral_trace_us_lacey_worker','public.alembic_version','SELECT')"
              )).scalar_one()
              public_select = conn.execute(text(
                  "select has_table_privilege("
                  "'public','public.alembic_version','SELECT')"
              )).scalar_one()
              if not runtime_select or worker_select or public_select:
                  raise SystemExit(
                      "Unsafe alembic_version privileges: "
                      f"runtime={runtime_select} worker={worker_select} public={public_select}"
                  )
              print(f"database_schema_after={version}")
              print("runtime_schema_metadata=READ_ONLY_PASS")
          engine.dispose()
          PY
