version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: litoral_trace_fastapi_app
    restart: always
    environment:
      DATABASE_URL: &postgres_url "postgresql+psycopg://litoral_user:litoral_secure_pass@db:5432/litoral_trace_db"
      POSTGRES_URL: *postgres_url
      DB_URL: *postgres_url
      ENVIRONMENT: production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - litoral_prod_network
    expose:
      - "8000"

  db:
    image: postgis/postgis:15-3.3-alpine
    container_name: litoral_trace_db
    restart: always
    environment:
      - POSTGRES_USER=litoral_user
      - POSTGRES_PASSWORD=litoral_secure_pass
      - POSTGRES_DB=litoral_trace_db
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - litoral_prod_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litoral_user -d litoral_trace_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  proxy:
    image: nginx:1.25-alpine
    container_name: litoral_trace_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks:
      - litoral_prod_network

volumes:
  postgres_prod_data:

networks:
  litoral_prod_network:
    driver: bridge
