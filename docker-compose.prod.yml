version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: litoral_trace_fastapi_app
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      ENVIRONMENT: production
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ISSUER: ${JWT_ISSUER:-}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
      REDIS_URL: ${REDIS_URL:-}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      GEE_PROJECT_ID: ${GEE_PROJECT_ID:-}
      GCP_SERVICE_ACCOUNT: ${GCP_SERVICE_ACCOUNT:-}
      GEE_SERVICE_ACCOUNT: ${GEE_SERVICE_ACCOUNT:-}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-}
      STORAGE_BUCKET_NAME: ${STORAGE_BUCKET_NAME:-}
      STORAGE_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - litoral_prod_network
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://127.0.0.1:8000/ready",
        ]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    command:
      [
        "python",
        "-m",
        "litoral_trace.workers.satellite_worker",
      ]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      WORKER_DATABASE_URL: ${WORKER_DATABASE_URL:?WORKER_DATABASE_URL is required}
      ENVIRONMENT: production
      WORKERS_ENABLED: "1"
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      GEE_PROJECT_ID: ${GEE_PROJECT_ID:-}
      GCP_SERVICE_ACCOUNT: ${GCP_SERVICE_ACCOUNT:-}
      GEE_SERVICE_ACCOUNT: ${GEE_SERVICE_ACCOUNT:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SATELLITE_WORKER_ID: ${SATELLITE_WORKER_ID:-}
      SATELLITE_WORKER_POLL_SECONDS: ${SATELLITE_WORKER_POLL_SECONDS:-5}
      SATELLITE_WORKER_HEARTBEAT_SECONDS: ${SATELLITE_WORKER_HEARTBEAT_SECONDS:-15}
      SATELLITE_WORKER_STALE_RECOVERY_INTERVAL_SECONDS: ${SATELLITE_WORKER_STALE_RECOVERY_INTERVAL_SECONDS:-30}
      SATELLITE_WORKER_RETRY_BASE_SECONDS: ${SATELLITE_WORKER_RETRY_BASE_SECONDS:-30}
      SATELLITE_WORKER_RETRY_MAX_SECONDS: ${SATELLITE_WORKER_RETRY_MAX_SECONDS:-900}
      SATELLITE_METRICS_ENABLED: ${SATELLITE_METRICS_ENABLED:-1}
      SATELLITE_METRICS_HOST: ${SATELLITE_METRICS_HOST:-0.0.0.0}
      SATELLITE_METRICS_PORT: ${SATELLITE_METRICS_PORT:-9108}
      SATELLITE_QUEUE_METRICS_REFRESH_SECONDS: ${SATELLITE_QUEUE_METRICS_REFRESH_SECONDS:-30}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - litoral_prod_network
    expose:
      - "9108"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-m",
          "litoral_trace.workers.satellite_worker",
          "--check",
        ]
      interval: 30s
      timeout: 15s
      start_period: 15s
      retries: 3
    stop_grace_period: 60s

  db:
    image: postgis/postgis:15-3.3-alpine
    container_name: litoral_trace_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - litoral_prod_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  proxy:
    image: nginx:1.25-alpine
    container_name: litoral_trace_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - litoral_prod_network

volumes:
  postgres_prod_data:

networks:
  litoral_prod_network:
    driver: bridge