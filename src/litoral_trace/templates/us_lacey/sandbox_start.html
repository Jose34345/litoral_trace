<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow,noarchive">

    <title>U.S. Lacey Act Sandbox | Litoral Trace</title>

    <link rel="icon" href="{{ url_for('static', path='/favicon.ico') }}" sizes="any">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', path='/img/logo.svg') }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', path='/apple-touch-icon.png') }}">
    <meta name="theme-color" content="#020617">

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='/dist/app.css') }}"
    >
</head>

<body class="min-h-full bg-slate-50 font-sans text-slate-900 antialiased">
    <main class="flex min-h-screen items-center justify-center bg-slate-50 px-4 py-10">
        <section
            class="w-full max-w-md rounded-xl border border-slate-200 bg-white p-8 shadow-sm"
            aria-labelledby="sandbox-title"
        >
            <header class="text-center">
                <div
                    class="mx-auto mb-5 flex h-11 w-11 items-center justify-center rounded-xl bg-white shadow-sm ring-1 ring-slate-200"
                    aria-hidden="true"
                >
                    <svg
                        viewBox="0 0 512 512"
                        xmlns="http://www.w3.org/2000/svg"
                        class="h-8 w-8 shrink-0"
                        aria-hidden="true"
                        focusable="false"
                    >
                        <g fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <path
                                d="M360 92 C286 49 188 61 126 126 C64 191 58 292 111 363 C164 434 261 458 340 422"
                                stroke="#059669"
                                stroke-width="30"
                            />
                            <path
                                d="M329 142 C274 111 204 119 159 163 C112 208 105 282 142 336 C179 390 250 410 310 385"
                                stroke="#059669"
                                stroke-width="30"
                            />
                            <path d="M254 168 V344" stroke="#020617" stroke-width="30" />
                            <path d="M254 211 H330 L374 167" stroke="#020617" stroke-width="28" />
                            <path d="M254 256 H390" stroke="#020617" stroke-width="28" />
                            <path d="M254 301 H330 L374 345" stroke="#020617" stroke-width="28" />
                        </g>
                        <circle cx="254" cy="256" r="24" fill="#059669" />
                        <circle cx="382" cy="159" r="19" fill="#059669" stroke="#020617" stroke-width="12" />
                        <circle cx="402" cy="256" r="19" fill="#059669" stroke="#020617" stroke-width="12" />
                        <circle cx="382" cy="353" r="19" fill="#059669" stroke="#020617" stroke-width="12" />
                    </svg>
                </div>

                <p class="text-sm font-semibold tracking-tight text-slate-900">
                    Litoral Trace
                </p>

                <h1
                    id="sandbox-title"
                    class="mt-4 text-2xl font-semibold tracking-tight text-slate-900"
                >
                    U.S. Lacey Act Sandbox
                </h1>

                <p class="mt-2 text-sm leading-6 text-slate-600">
                    Test the compliance engine with your own shipment documents.
                </p>
            </header>

            <form method="post" action="/sandbox/start" class="mt-8">
                <input type="hidden" name="consent" value="accepted">

                <label
                    class="mb-5 flex cursor-pointer items-start gap-3 rounded-lg border border-slate-200 bg-slate-50 p-4 text-left"
                >
                    <input
                        type="checkbox"
                        name="learning_consent"
                        value="accepted"
                        class="mt-1 h-4 w-4 shrink-0 rounded border-slate-300 text-emerald-600 focus:ring-emerald-600"
                    >
                    <span>
                        <span class="block text-sm font-semibold text-slate-900">Help improve Litoral Trace</span>
                        <span class="mt-1 block text-xs leading-5 text-slate-600">
                            Allow Litoral Trace to retain de-identified excerpts from corrected fields for product improvement.
                        </span>
                    </span>
                </label>

                <button
                    type="submit"
                    class="flex w-full items-center justify-center rounded-lg bg-emerald-600 px-4 py-3 text-sm font-semibold text-white shadow-sm transition-colors hover:bg-emerald-800"
                >
                    Start Document Analysis
                </button>
            </form>

            <p class="mt-6 text-center text-xs leading-5 text-slate-500">
                For your privacy, this ephemeral workspace and all uploaded files are
                permanently destroyed after 4 hours.
            </p>
        </section>
    </main>
</body>
</html>
