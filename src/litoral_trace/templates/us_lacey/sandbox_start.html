<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <title>U.S. Lacey Act Sandbox | Litoral Trace</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/dist/app.css') }}">
</head>
<body class="min-h-full bg-slate-50 font-sans text-slate-900 antialiased">
    <main class="flex min-h-screen items-center justify-center px-4 py-10 sm:px-6">
        <section
            class="w-full max-w-md rounded-xl border border-slate-200 bg-white p-8 shadow-sm"
            aria-labelledby="sandbox-title"
        >
            <header class="text-center">
                <div
                    class="mx-auto mb-5 flex h-11 w-11 items-center justify-center rounded-xl bg-emerald-600 text-sm font-bold text-white shadow-sm"
                    aria-hidden="true"
                >
                    LT
                </div>
                <p class="text-sm font-semibold tracking-tight text-slate-900">Litoral Trace</p>
                <h1 id="sandbox-title" class="mt-4 text-2xl font-semibold tracking-tight text-slate-900">
                    U.S. Lacey Act Sandbox
                </h1>
                <p class="mt-2 text-sm leading-6 text-slate-600">
                    Test the compliance engine with your own shipment documents.
                </p>
            </header>

            <form method="post" action="/sandbox/start" class="mt-8">
                <input type="hidden" name="consent" value="accepted">
                <button
                    type="submit"
                    class="flex w-full items-center justify-center rounded-lg bg-emerald-600 px-4 py-3 text-sm font-semibold text-white shadow-sm transition-colors hover:bg-emerald-700 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-600"
                >
                    Start Document Analysis
                </button>
            </form>

            <p class="mt-6 text-center text-xs leading-5 text-slate-500">
                For your privacy, this ephemeral workspace and all uploaded files are
                permanently destroyed after 4 hours.
            </p>
        </section>
    </main>
</body>
</html>
