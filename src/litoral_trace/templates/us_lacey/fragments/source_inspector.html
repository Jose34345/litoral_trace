<dialog class="lt-source-inspector" data-source-inspector aria-labelledby="source-inspector-title">
  <section class="lt-source-inspector__panel" aria-label="Original source PDF inspector">
    <header class="lt-source-inspector__header">
      <div class="min-w-0">
        <p class="text-[11px] font-bold uppercase tracking-widest text-emerald-700">Source evidence · read-only</p>
        <h2 id="source-inspector-title" class="mt-1 truncate text-sm font-bold text-slate-950" data-inspector-title>Original PDF</h2>
        <p class="text-[11px] text-slate-600" data-inspector-locator>Review the page before confirming this value.</p>
      </div>
      <button type="button" class="lt-source-inspector__close" data-source-inspector-close aria-label="Close source inspector">×</button>
    </header>
    <div class="lt-source-inspector__body">
      <iframe data-inspector-frame title="Verified original PDF page" loading="lazy" referrerpolicy="same-origin" src="about:blank"></iframe>
      <div class="lt-source-inspector__fallback">
        <span>Originals may expire under your retention policy. If unavailable, request the original; a worksheet is not independent evidence.</span>
        <a href="#" target="_blank" rel="noopener noreferrer" data-inspector-external>Open original in new tab</a>
      </div>
    </div>
  </section>
</dialog>
