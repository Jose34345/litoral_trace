{% extends "app/base_app.html" %}

{% block title %}Cerrar sesión | Litoral Trace{% endblock %}

{% block content %}
<section class="max-w-lg mx-auto my-12 bg-white rounded-2xl border border-slate-200 shadow-sm p-8">
    <div class="w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center text-slate-700">
        <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
    </div>

    <h1 class="mt-4 text-xl font-bold text-slate-950">
        Cerrar sesión
    </h1>

    <p class="mt-2 text-sm text-slate-600">
        Se revocará la sesión activa de
        <strong>{{ user.username }}</strong>
        para
        <strong>{{ user.organization_name }}</strong>.
    </p>

    <div class="mt-6 flex flex-wrap gap-3">
        <form method="post" action="/logout">
            <input
                type="hidden"
                name="{{ csrf_form_field }}"
                value="{{ csrf_token }}"
            >
            <button
                type="submit"
                class="px-4 py-2.5 rounded-lg bg-slate-900 hover:bg-slate-950 text-white text-sm font-semibold"
            >
                Confirmar cierre de sesión
            </button>
        </form>

        <a
            href="/dashboard"
            class="px-4 py-2.5 rounded-lg border border-slate-300 bg-white hover:bg-slate-50 text-slate-700 text-sm font-semibold"
        >
            Volver
        </a>
    </div>
</section>
{% endblock %}
