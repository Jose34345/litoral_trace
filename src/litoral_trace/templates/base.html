<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    {% if csrf_token %}
    <meta name="csrf-token" content="{{ csrf_token }}">
    {% endif %}

    <title>{% block title %}Litoral Trace | Trazabilidad de origen y cadena de custodia{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', path='/dist/app.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='/vendor/fontawesome/css/all.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='/vendor/leaflet/leaflet.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='/src/design-system.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='/src/data-table.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='/src/form-controls.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='/src/dialog.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='/src/dropdown.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='/src/skeleton.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='/src/progress.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='/src/geospatial.css') }}">

    <script src="{{ url_for('static', path='/vendor/htmx/htmx.min.js') }}" defer></script>
    <script src="{{ url_for('static', path='/vendor/leaflet/leaflet.js') }}" defer></script>
    <script type="module" src="{{ url_for('static', path='/src/js/app.js') }}"></script>
    <script type="module" src="{{ url_for('static', path='/src/js/dialog.js') }}"></script>

    {% block head_extra %}{% endblock %}
</head>
<body class="{% block body_class %}h-full font-sans text-slate-800 antialiased{% endblock %}">
    {% block shell %}{% endblock %}
    {% block body_scripts %}{% endblock %}
</body>
</html>
