  ".github/workflows/ci.yml",
  ".github/workflows/us-lacey-postgres-gate.yml"
]
notes = "Versioned exact-match taxonomy candidates are attached to non-canonical Product Intelligence material evidence. Accepted scientific-name matches may be RESOLVED as advisory evidence; synonyms/common/commercial/genus aliases remain REVIEW_REQUIRED; multiple exact candidates remain AMBIGUOUS; unsupported or near/fuzzy names remain NO_MATCH. The resolver never writes canonical shipment truth, PPQ505 or LAWGS and does not alter BOM readiness."

