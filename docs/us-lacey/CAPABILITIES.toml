version = 1
product = "us_lacey"
canonical_docs = "docs/us-lacey"

[authority_levels]
observation = "Literal or structurally extracted source information; not final truth."
inferred = "Machine-derived and evidence-backed; may still require adjudication."
deterministic = "Result of explicit deterministic logic/calculation."
review_required = "Insufficient or conflicting support; human action required."
human_confirmed = "Explicit reviewer decision with audit history."
canonical = "Published operational truth eligible for downstream presentation/export."

