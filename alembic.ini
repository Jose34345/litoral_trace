[alembic]
# path to migration scripts
script_location = alembic
# sys.path prefix, relative to current working directory.
prepend_sys_path = src
# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s
# timezone to use when rendering dates
timezone = utc

[alembic:runtime]
# set the sqlalchemy.url here or in environment
sqlalchemy.url = env:DATABASE_URL

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[logger_sqlalchemy]
level = WARN
handlers = console
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s

[post_write_hooks]
# hooks can be configured here if needed
